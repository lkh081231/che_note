# 把 colab/chNN-*.ipynb 推到 Google Drive「Colab Notebooks/che_note/」，原地替换。
# 同名文件会更新内容、生成新 revision，file ID 不变，所以 README 里的 Drive 链接一直有效。
# 推完用 colab/drive-ids.json 核对 ID：ID 对不上说明 Drive 上多出了一份副本，job 会失败。
# 新章还没写进 drive-ids.json 时，只在 summary 里给出 ID，不算失败。
#
# 需要 repo secret RCLONE_CONF：本机 `rclone config show gdrive` 的完整输出（含 [gdrive] 和 token）。
name: Sync notebooks to Drive

on:
  push:
    branches: [main]
    paths: ['colab/ch[0-9][0-9]-*.ipynb']
  workflow_dispatch:
    inputs:
      all:
        description: '推送全部 notebook（不勾只推最近一次 commit 改过的）'
        type: boolean
        default: true

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          test -n "$RCLONE_CONF" || { echo "::error::缺少 secret RCLONE_CONF"; exit 1; }
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Pick notebooks
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
        run: |
          all() { git ls-files 'colab/ch[0-9][0-9]-*.ipynb'; }
          if [ "$ALL" = "true" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            all > files.txt
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git diff --name-only HEAD~1 HEAD -- 'colab/ch[0-9][0-9]-*.ipynb' > files.txt
          else
            git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'colab/ch[0-9][0-9]-*.ipynb' > files.txt
          fi
          grep -v '_output\.ipynb$' files.txt | while read -r f; do [ -f "$f" ] && echo "$f"; done > sync.txt || true
          echo "要推送的 notebook："; cat sync.txt
          echo "count=$(wc -l < sync.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload (replace in place) and verify IDs
        if: steps.pick.outputs.count != '0'
        run: |
          DEST="gdrive:Colab Notebooks/che_note"
          echo "| notebook | Drive ID | 大小 | 结果 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          while read -r f; do
            name=$(basename "$f")
            rclone copyto "$f" "$DEST/$name" --retries 3
            meta=$(rclone lsjson --stat "$DEST/$name")
            read -r id size < <(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d["ID"], d["Size"])' "$meta")
            want=$(python3 -c 'import json,sys; print(json.load(open("colab/drive-ids.json")).get(sys.argv[1], ""))' "$name")
            local_size=$(stat -c %s "$f")
            if [ "$size" != "$local_size" ]; then
              res="❌ 大小不符（本地 $local_size）"; fail=1
            elif [ -z "$want" ]; then
              res="🆕 新文件，把 ID 加进 colab/drive-ids.json"
              echo "::warning::$name 不在 drive-ids.json：$id"
            elif [ "$want" != "$id" ]; then
              res="❌ ID 不符（应为 $want，Drive 上可能有同名副本）"; fail=1
            else
              res="✅ 已替换"
            fi
            echo "| $name | [$id](https://colab.research.google.com/drive/$id) | $size | $res |" >> "$GITHUB_STEP_SUMMARY"
          done < sync.txt
          exit $fail
