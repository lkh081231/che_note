<h3>Electronegativity 与 bond 类型（ΔEN → bond type）</h3>

<div class="row eb-presets" role="group" aria-label="preset bonds">
  <span class="eb-plab">预设：</span>
  <button type="button" class="eb-pre" data-preset="Cl-Cl">Cl–Cl（0）</button>
  <button type="button" class="eb-pre" data-preset="C-H">C–H（0.4）</button>
  <button type="button" class="eb-pre on" data-preset="H-Cl">H–Cl（0.9）</button>
  <button type="button" class="eb-pre" data-preset="Al-Cl">Al–Cl（1.5）</button>
  <button type="button" class="eb-pre" data-preset="Na-Cl">Na–Cl（2.1）</button>
  <button type="button" class="eb-pre" data-preset="Mg-O">Mg–O（2.3）</button>
</div>
<div class="eb-alnote">Al–Cl 旁注：<b>metal + non-metal 但不是 ionic → AlCl₃ covalent</b>（ΔEN = 1.5 &lt; 2.0）</div>

<div class="card eb-ptwrap">
  <div class="eb-tr-across" aria-label="trend across a period">
    <span>across a period: electronegativity increases</span>
    <span class="eb-arr-h" aria-hidden="true"></span>
  </div>
  <div class="eb-ptbox">
    <div class="eb-pt" role="grid" aria-label="Pauling electronegativity periodic table"></div>
    <div class="eb-tr-down" aria-label="trend down a group">
      <span class="eb-tr-dtxt">down a<br>group:<br>decreases</span>
      <span class="eb-arr-v" aria-hidden="true"></span>
    </div>
  </div>
  <div class="eb-ptfoot">
    <span class="eb-scale"><span>Pauling scale: 0.8</span><i class="eb-grad"></i><span>4.0</span></span>
    <span class="eb-keys"><i class="eb-ka">A</i> 第一次点　<i class="eb-kb">B</i> 第二次点（同一格点两次 → ΔEN = 0；悬停看原因）</span>
  </div>
</div>

<div class="card eb-calc" data-phase="2">
  <div class="eb-pair"></div>
  <div class="eb-eq"></div>
  <div class="eb-badge"></div>
</div>

<div class="card eb-rcard">
  <div class="eb-shead">ΔEN 判据尺（0 – 3.3）</div>
  <svg class="eb-ruler" viewBox="0 0 760 158" aria-label="electronegativity difference ruler"></svg>
  <div class="eb-verdict"></div>
</div>

<div class="card eb-bcard">
  <div class="eb-shead">Bonding pair 位置与电荷分布</div>
  <svg class="eb-bond" viewBox="0 0 760 198" aria-label="bond electron pair schematic"></svg>
  <p class="eb-cap"></p>
</div>

/* calculator bar */

.k .eb-bond text.eb-chg-p{font-size:17px;font-weight:700;fill:var(--pos)}
.k .eb-bond text.eb-chg-n{font-size:17px;font-weight:700;fill:var(--neg)}

</style>

<script>
K.init($root);
var $ = function (s) { return $root.querySelector(s); };

/* Lecture Pauling electronegativity table (section 3.1 C) */
var GROUPS = [1, 2, 13, 14, 15, 16, 17];
var RAW = [
  /* [sym, Z, period, group, EN, name, metal?] */
  ['H',  1,  1, 1,  2.1, 'hydrogen',   0],
  ['Li', 3,  2, 1,  1.0, 'lithium',    1],
  ['Be', 4,  2, 2,  1.5, 'beryllium',  1],
  ['B',  5,  2, 13, 2.0, 'boron',      0],
  ['C',  6,  2, 14, 2.5, 'carbon',     0],
  ['N',  7,  2, 15, 3.0, 'nitrogen',   0],
  ['O',  8,  2, 16, 3.5, 'oxygen',     0],
  ['F',  9,  2, 17, 4.0, 'fluorine',   0],
  ['Na', 11, 3, 1,  0.9, 'sodium',     1],
  ['Mg', 12, 3, 2,  1.2, 'magnesium',  1],
  ['Al', 13, 3, 13, 1.5, 'aluminium',  1],
  ['Si', 14, 3, 14, 1.8, 'silicon',    0],
  ['P',  15, 3, 15, 2.1, 'phosphorus', 0],
  ['S',  16, 3, 16, 2.5, 'sulfur',     0],
  ['Cl', 17, 3, 17, 3.0, 'chlorine',   0],
  ['K',  19, 4, 1,  0.8, 'potassium',  1],
  ['Ca', 20, 4, 2,  1.0, 'calcium',    1],
  ['Ga', 31, 4, 13, 1.6, 'gallium',    1],
  ['Ge', 32, 4, 14, 1.8, 'germanium',  0],
  ['As', 33, 4, 15, 2.0, 'arsenic',    0],
  ['Se', 34, 4, 16, 2.4, 'selenium',   0],
  ['Br', 35, 4, 17, 2.8, 'bromine',    0],
  ['I',  53, 5, 17, 2.5, 'iodine',     0]
];
var BY_SYM = {}, BY_PG = {};
RAW.forEach(function (r) {
  var o = { sym: r[0], Z: r[1], per: r[2], grp: r[3], en: r[4], name: r[5], metal: !!r[6] };
  BY_SYM[o.sym] = o;
  BY_PG[o.per + ':' + o.grp] = o;
});

var PRESETS = {
  'Cl-Cl': ['Cl', 'Cl'],
  'C-H':   ['C',  'H'],
  'H-Cl':  ['H',  'Cl'],
  'Al-Cl': ['Al', 'Cl'],
  'Na-Cl': ['Na', 'Cl'],
  'Mg-O':  ['Mg', 'O']
};

/* Sequential heatmap colour using kit tokens so both light and dark themes keep high contrast */
function heatBg(en) {
  var t = Math.max(0, Math.min(1, (en - 0.8) / 3.2));
  if (t <= 0.45) {
    var p = Math.round(16 + (t / 0.45) * 62);
    var q = Math.round((t / 0.45) * 20);
    return 'color-mix(in srgb, var(--hl) ' + p + '%, color-mix(in srgb, var(--s4) ' + q + '%, var(--card)))';
  }
  var u = (t - 0.45) / 0.55;
  var p2 = Math.round(24 * (1 - u));
  var q2 = Math.round(16 + u * 32);
  return 'color-mix(in srgb, var(--s2) ' + q2 + '%, color-mix(in srgb, var(--s4) ' + p2 + '%, var(--card)))';
}

/* Hover tooltip explaining EN via nuclear charge, atomic radius, and shielding (section 3.1 B–C) */
function tipFor(e) {
  var head = '<b>' + e.sym + '</b> (' + e.name + ', <i>Z</i> = ' + e.Z + ') · EN = <b>' + e.en.toFixed(1) + '</b>';
  if (e.sym === 'F') {
    return head + '（<b>most electronegative</b>）<br>Period 2 最右：nuclear charge 大（+9），仅 1s² 一层 inner shell（shielding 极小）、atomic radius 极小 → 对 bonding pair 吸引最强。';
  }
  if (e.sym === 'H') {
    return head + '<br>虽然 nuclear charge 只有 +1，但没有 inner shells（shielding = 0）、atomic radius 极小，对 bonding pair 吸引比 Group 1 metals 强得多。';
  }
  if (e.sym === 'Ga') {
    return head + '<br>d-block 之后：nuclear charge 比 Al 大 +18，而 3d¹⁰ sub-shell 的 shielding 较弱，atomic radius 未明显增大，故 EN（1.6）略高于 Al（1.5）。';
  }
  if (e.sym === 'Ge') {
    return head + '<br>d-block 之后：nuclear charge 比 Si 大 +18，而 3d¹⁰ sub-shell 的 shielding 较弱，atomic radius 几乎未增，故 EN（1.8）与 Si 相同。';
  }
  if (e.per === 2) {
    var why2 = e.grp <= 2
      ? 'Period 2 左侧：同 period 中 nuclear charge 较小、atomic radius 较大（shielding 仅来自 1s²），对 bonding pair 吸引较弱。'
      : e.grp <= 14
      ? 'across Period 2 居中：nuclear charge 随左 → 右增大，electrons 填在同一 shell（shielding 相近），atomic radius 减小。'
      : 'Period 2 右侧：nuclear charge 较大，仅 1s² inner shell（shielding 极小）、atomic radius 小 → 对 bonding pair 吸引很强。';
    return head + '<br>' + why2;
  }
  var up = BY_PG[(e.per - 1) + ':' + e.grp];
  var upName = up ? up.sym + '（' + up.en.toFixed(1) + '）' : '同 Group 上方元素';
  var across = e.grp <= 2
    ? 'Period ' + e.per + ' 左侧（同 period 中 nuclear charge 较小、atomic radius 较大）；'
    : e.grp <= 14
    ? 'across Period ' + e.per + ' 居中（nuclear charge 比左侧金属大、atomic radius 较小）；'
    : 'Period ' + e.per + ' 右侧（同 shell 内 nuclear charge 大、shielding 相近、atomic radius 较小）；';
  return head + '<br>' + across + 'down Group ' + e.grp + ' 比 ' + upName + ' 多了 inner shell(s)，atomic radius 与 shielding 增大（outweigh nuclear charge 增加）→ EN 下降。';
}

/* Build the Periodic Table heatmap grid */
var ptEl = $('.eb-pt');
ptEl.appendChild(K.el('div', { 'class': 'eb-corner' }, 'Group →'));
GROUPS.forEach(function (g, idx) {
  if (idx === 2) ptEl.appendChild(K.el('div', { 'class': 'eb-dgap', 'aria-hidden': 'true' }));
  ptEl.appendChild(K.el('div', { 'class': 'eb-gh', 'data-grp': g }, String(g)));
});

[1, 2, 3, 4, 5].forEach(function (per) {
  ptEl.appendChild(K.el('div', { 'class': 'eb-ph' }, 'Period ' + per));
  GROUPS.forEach(function (g, idx) {
    if (idx === 2) ptEl.appendChild(K.el('div', { 'class': 'eb-dgap', 'aria-hidden': 'true' }));
    if (per === 1 && g >= 15) {
      if (g === 15) {
        ptEl.appendChild(K.el('div', { 'class': 'eb-fmost-wrap' }, '<span class="eb-fmost">most electronegative ↓</span>'));
      }
      return;
    }
    var e = BY_PG[per + ':' + g];
    if (!e) {
      ptEl.appendChild(K.el('div', { 'class': 'eb-empty', 'aria-hidden': 'true' }));
      return;
    }
    var attrs = {
      type: 'button',
      'class': 'eb-cell',
      'data-el': e.sym,
      'data-en': e.en.toFixed(1),
      'data-per': per,
      'data-grp': g,
      'data-tip': tipFor(e)
    };
    if (e.sym === 'F') attrs['data-most'] = 'most electronegative';
    var btn = K.el('button', attrs,
      '<span class="eb-top"><b class="eb-sym">' + e.sym + '</b><i class="eb-tag"></i></span>' +
      '<span class="eb-val">' + e.en.toFixed(1) + '</span>');
    btn.style.background = heatBg(e.en);
    btn.addEventListener('click', function () { clickCell(e.sym); });
    ptEl.appendChild(btn);
  });
});

/* Selection state:
   phase = 2 → pair (selA, selB) complete; next table click restarts as A (phase = 1).
   phase = 1 → selA chosen, waiting for 2nd click to set selB (phase = 2). */
var selA = 'H', selB = 'Cl', phase = 2;

function clickCell(sym) {
  if (phase === 2) {
    selA = sym;
    selB = null;
    phase = 1;
  } else {
    selB = sym;
    phase = 2;
  }
  update();
}

K.$$($root, '.eb-pre').forEach(function (b) {
  b.addEventListener('click', function () {
    var p = PRESETS[b.getAttribute('data-preset')];
    selA = p[0]; selB = p[1]; phase = 2;
    update();
  });
});

function fmtDiff(d) {
  return d < 1e-9 ? '0' : d.toFixed(1);
}
function zoneOf(d) {
  if (d < 1e-9) return 'nonpolar';
  if (d < 1.0 - 1e-9) return 'polar';
  if (d < 2.0 - 1e-9) return 'intermediate';
  return 'ionic';
}
/* Common ion charge magnitudes by Group when ΔEN ≥ 2.0 */
var CAT_Q = { 1: 1, 2: 2, 13: 3, 14: 4, 15: 3 };
var AN_Q  = { 15: 3, 16: 2, 17: 1, 14: 4, 1: 1 };
function chgSup(mag, pos) {
  return (mag === 1 ? '' : K.sup(mag)) + (pos ? '⁺' : '⁻');
}
function chgPlain(mag, pos) {
  return (mag === 1 ? '' : String(mag)) + (pos ? '+' : '−');
}

function putLabel(svgEl, x, y, txt, o) {
  var t = K.label(svgEl, x, y, txt, o);
  t.setAttribute('data-ax', x);
  t.setAttribute('data-ay', y);
  return t;
}

/* ---------------- SVG 1: ΔEN ruler (0–3.3) ---------------- */
var rulerSvg = $('.eb-ruler'), bondSvg = $('.eb-bond');

function drawRuler(diff, z) {
  while (rulerSvg.firstChild) rulerSvg.removeChild(rulerSvg.firstChild);
  var H = 158;
  var W = Math.max(Math.round(rulerSvg.getBoundingClientRect().width) || 760, 520);
  rulerSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  rulerSvg.setAttribute('data-den', fmtDiff(diff));
  rulerSvg.setAttribute('data-zone', z);

  var defs = K.svg('defs');
  var gid = $root.id + '-cgrad', hid = $root.id + '-hatch';
  var lg = K.svg('linearGradient', { id: gid, x1: '0%', y1: '0%', x2: '100%', y2: '0%' });
  lg.appendChild(K.svg('stop', { offset: '0%', 'stop-color': 'var(--acc-soft)' }));
  lg.appendChild(K.svg('stop', { offset: '100%', 'stop-color': 'var(--s1)', 'stop-opacity': '0.36' }));
  defs.appendChild(lg);

  var pat = K.svg('pattern', { id: hid, width: 10, height: 10, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
  pat.appendChild(K.svg('rect', { width: 10, height: 10, fill: 'var(--hl)', 'fill-opacity': '0.35' }));
  pat.appendChild(K.svg('line', { x1: 0, y1: 0, x2: 0, y2: 10, stroke: 'var(--s4)', 'stroke-width': 3, 'stroke-opacity': '0.38' }));
  defs.appendChild(pat);
  rulerSvg.appendChild(defs);

  var x0 = 38, x1 = W - 26, bw = x1 - x0, MAX = 3.3;
  function X(v) { return x0 + Math.max(0, Math.min(MAX, v)) / MAX * bw; }
  var yT = 52, hB = 38, yB = yT + hB;
  var x10 = X(1.0), x20 = X(2.0);
  var avoid = [], placed = [];

  /* Zone rectangles */
  rulerSvg.appendChild(K.svg('rect', { x: x0, y: yT, width: x10 - x0, height: hB, fill: 'url(#' + gid + ')' }));
  rulerSvg.appendChild(K.svg('rect', { x: x10, y: yT, width: x20 - x10, height: hB, fill: 'url(#' + hid + ')' }));
  rulerSvg.appendChild(K.svg('rect', { x: x20, y: yT, width: x1 - x20, height: hB, fill: 'var(--s2)', 'fill-opacity': '0.24' }));
  rulerSvg.appendChild(K.svg('rect', { x: x0, y: yT, width: bw, height: hB, fill: 'none', stroke: 'var(--fg)', 'stroke-width': 1.3, rx: 4 }));

  /* Zero non-polar highlight bar on left edge + boundary dividers */
  rulerSvg.appendChild(K.svg('line', { x1: x0, y1: yT, x2: x0, y2: yB, stroke: 'var(--fg)', 'stroke-width': 3 }));
  rulerSvg.appendChild(K.svg('line', { x1: x10, y1: yT, x2: x10, y2: yB, stroke: 'var(--fg)', 'stroke-width': 1.4, 'stroke-dasharray': '4 3' }));
  rulerSvg.appendChild(K.svg('line', { x1: x20, y1: yT, x2: x20, y2: yB, stroke: 'var(--fg)', 'stroke-width': 1.6 }));

  avoid.push([x0, yT, x1, yT], [x0, yB, x1, yB], [x0, yT, x0, yB], [x1, yT, x1, yB], [x10, yT, x10, yB], [x20, yT, x20, yB]);

  /* Ticks along bottom of bar */
  var ticks = [0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0];
  ticks.forEach(function (v) {
    var tx = X(v);
    rulerSvg.appendChild(K.svg('line', { x1: tx, y1: yB, x2: tx, y2: yB + 5, stroke: 'var(--fg)', 'stroke-width': 1.2 }));
    avoid.push([tx, yB, tx, yB + 5]);
  });

  /* L-shaped leader line from tick 0 down to "0: non-polar covalent" */
  rulerSvg.appendChild(K.svg('path', {
    d: 'M ' + x0 + ' ' + (yB + 30) + ' L ' + x0 + ' ' + (yB + 43) + ' L ' + (x0 + 6) + ' ' + (yB + 43),
    fill: 'none', stroke: 'var(--mut)', 'stroke-width': 1.2
  }));
  avoid.push([x0, yB + 30, x0, yB + 43], [x0, yB + 43, x0 + 6, yB + 43]);

  /* Pointer for current ΔEN */
  var xp = X(diff);
  var pCol = z === 'ionic' ? 'var(--s2)' : z === 'intermediate' ? 'var(--s4)' : z === 'polar' ? 'var(--s1)' : 'var(--fg)';
  rulerSvg.appendChild(K.svg('polygon', {
    'class': 'eb-ptr',
    points: [xp + ',' + (yT - 2), (xp - 7) + ',' + (yT - 14), (xp + 7) + ',' + (yT - 14)].join(' '),
    fill: pCol
  }));
  rulerSvg.appendChild(K.svg('line', { x1: xp, y1: yT - 14, x2: xp, y2: yT - 22, stroke: pCol, 'stroke-width': 2.2 }));
  /* In-bar marker: short stubs at top / bottom edge only, so the zone label
     (opaque halo) never sits on top of the pointer line (C–H 0.4, Al–Cl 1.5). */
  rulerSvg.appendChild(K.svg('line', { 'class': 'eb-stub', x1: xp, y1: yT, x2: xp, y2: yT + 5, stroke: pCol, 'stroke-width': 2.4 }));
  rulerSvg.appendChild(K.svg('line', { 'class': 'eb-stub', x1: xp, y1: yB - 5, x2: xp, y2: yB, stroke: pCol, 'stroke-width': 2.4 }));
  avoid.push([xp, yT - 2, xp - 7, yT - 14], [xp, yT - 2, xp + 7, yT - 14], [xp - 7, yT - 14, xp + 7, yT - 14], [xp, yT - 14, xp, yT - 22],
             [xp, yT, xp, yT + 5], [xp, yB - 5, xp, yB]);

  /* Labels placed via K.label on the <svg> itself */
  putLabel(rulerSvg, xp, yT - 22, 'ΔEN = ' + fmtDiff(diff), {
    cls: 'eb-ptr-t', avoid: avoid, placed: placed, pad: 1,
    cands: [[0, -10, 'middle'], [6, -10, 'start'], [-6, -10, 'end']]
  });

  var ym = yT + hB / 2;
  putLabel(rulerSvg, (x0 + x10) / 2, ym, 'covalent (polar ↑)', {
    cls: 'eb-zl', avoid: avoid, placed: placed, pad: 1,
    cands: [[0, 5, 'middle']]
  });
  putLabel(rulerSvg, (x10 + x20) / 2, ym, 'intermediate — 不考', {
    cls: 'eb-zl', avoid: avoid, placed: placed, pad: 1,
    cands: [[0, 5, 'middle']]
  });
  putLabel(rulerSvg, (x20 + x1) / 2, ym, '≥ 2.0: ionic', {
    cls: 'eb-zl', avoid: avoid, placed: placed, pad: 1,
    cands: [[0, 5, 'middle']]
  });

  ticks.forEach(function (v) {
    putLabel(rulerSvg, X(v), yB + 5, v === 0 ? '0' : v.toFixed(1), {
      cls: 'eb-tk', avoid: avoid, placed: placed, pad: 1,
      cands: [[0, 18, 'middle']]
    });
  });

  putLabel(rulerSvg, x0 + 6, yB + 43, '0: non-polar covalent', {
    cls: 'eb-sub', avoid: avoid, placed: placed, pad: 1,
    cands: [[5, 5, 'start']]
  });
  putLabel(rulerSvg, (x10 + x20) / 2, yB + 43, 'out of syllabus', {
    cls: 'eb-sub', avoid: avoid, placed: placed, pad: 1,
    cands: [[0, 5, 'middle']]
  });
}

/* ---------------- SVG 2: Bond schematic ---------------- */
function cloudPath(xL, xR, cy, rL, rR, neck) {
  var xm = (xL + xR) / 2;
  return [
    'M', xL, cy - rL,
    'C', xL - rL * 1.15, cy - rL, xL - rL * 1.15, cy + rL, xL, cy + rL,
    'C', xL + rL * 0.7, cy + rL, xm - 24, cy + neck, xm, cy + neck,
    'C', xm + 24, cy + neck, xR - rR * 0.7, cy + rR, xR, cy + rR,
    'C', xR + rR * 1.15, cy + rR, xR + rR * 1.15, cy - rR, xR, cy - rR,
    'C', xR - rR * 0.7, cy - rR, xm + 24, cy - neck, xm, cy - neck,
    'C', xm - 24, cy - neck, xL + rL * 0.7, cy - rL, xL, cy - rL,
    'Z'
  ].join(' ');
}

function circleBoxSegs(cx, cy, r) {
  return [
    [cx - r, cy - r, cx + r, cy - r],
    [cx - r, cy + r, cx + r, cy + r],
    [cx - r, cy - r, cx - r, cy + r],
    [cx + r, cy - r, cx + r, cy + r]
  ];
}

function drawBond(a, b, diff, z) {
  while (bondSvg.firstChild) bondSvg.removeChild(bondSvg.firstChild);
  var H = 198;
  var W = Math.max(Math.round(bondSvg.getBoundingClientRect().width) || 760, 520);
  bondSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  bondSvg.setAttribute('data-mode', z);

  var cx = Math.round(W / 2), cy = 98;
  var avoid = [], placed = [];
  var dir = b.en > a.en ? 1 : (a.en > b.en ? -1 : 0);

  if (z !== 'ionic') {
    /* Covalent / polar covalent / intermediate (< 2.0) */
    var xL = cx - 92, xR = cx + 92, R = 32;
    var s = diff < 1e-9 ? 0 : Math.pow(Math.min(diff / 2.0, 0.96), 0.68);
    var rL = 46 + (dir < 0 ? 10 * s : -8 * s);
    var rR = 46 + (dir > 0 ? 10 * s : -8 * s);
    var cloudCol = diff < 1e-9 ? 'var(--acc)' : (dir > 0 ? 'var(--neg)' : 'var(--pos)');
    bondSvg.appendChild(K.svg('path', {
      'class': 'eb-cloud',
      d: cloudPath(xL, xR, cy, rL, rR, 33),
      fill: cloudCol, 'fill-opacity': '0.10',
      stroke: cloudCol, 'stroke-opacity': '0.32', 'stroke-width': 1.4
    }));

    /* Midpoint reference dashed line (decorative) */
    bondSvg.appendChild(K.svg('line', {
      x1: cx, y1: cy - 36, x2: cx, y2: cy + 36,
      stroke: 'var(--line)', 'stroke-width': 1.2, 'stroke-dasharray': '3 3'
    }));

    /* Two atom circles */
    bondSvg.appendChild(K.svg('circle', {
      'class': 'eb-atom eb-atom-l', cx: xL, cy: cy, r: R,
      fill: 'var(--card)', stroke: 'var(--s1)', 'stroke-width': 2.5
    }));
    bondSvg.appendChild(K.svg('circle', {
      'class': 'eb-atom eb-atom-r', cx: xR, cy: cy, r: R,
      fill: 'var(--card)', stroke: 'var(--s5)', 'stroke-width': 2.5
    }));

    /* Atom symbols inside circles (placed BEFORE circle bounding segments enter avoid) */
    putLabel(bondSvg, xL, cy, a.sym, { cls: 'eb-asym', avoid: avoid, placed: placed, pad: 1, cands: [[0, 7, 'middle']] });
    putLabel(bondSvg, xR, cy, b.sym, { cls: 'eb-asym', avoid: avoid, placed: placed, pad: 1, cands: [[0, 7, 'middle']] });

    circleBoxSegs(xL, cy, R).forEach(function (sg) { avoid.push(sg); });
    circleBoxSegs(xR, cy, R).forEach(function (sg) { avoid.push(sg); });

    /* Bonding electron pair (two dots) */
    var xPair = cx + dir * Math.round(54 * s);
    bondSvg.setAttribute('data-xpair', xPair);
    bondSvg.setAttribute('data-xl', xL);
    bondSvg.setAttribute('data-xr', xR);
    [-8, 8].forEach(function (dy) {
      bondSvg.appendChild(K.svg('circle', {
        'class': 'eb-edot', cx: xPair, cy: cy + dy, r: 5,
        fill: 'var(--acc)', stroke: 'var(--card)', 'stroke-width': 1.5
      }));
    });
    placed.push({ x: xPair - 7, y: cy - 15, w: 14, h: 30 });

    /* Leader line from bonding pair cleanly outside the cloud contour down to label */
    bondSvg.appendChild(K.svg('line', { x1: xPair, y1: cy + 18, x2: xPair, y2: cy + 60, stroke: 'var(--acc)', 'stroke-width': 1.3 }));
    avoid.push([xPair, cy + 18, xPair, cy + 60]);

    var pairTxt = diff < 1e-9 ? 'bonding pair (正中共享)' : 'bonding pair (偏向 ' + (dir > 0 ? b.sym : a.sym) + ')';
    putLabel(bondSvg, xPair, cy + 60, pairTxt, {
      cls: 'eb-note', avoid: avoid, placed: placed, pad: 1,
      cands: [[0, 18, 'middle'], [8, 18, 'start'], [-8, 18, 'end']]
    });

    /* EN values on outer left / outer right (outside cloud contour) */
    putLabel(bondSvg, xL - 58, cy, 'EN = ' + a.en.toFixed(1), {
      cls: 'eb-aen', avoid: avoid, placed: placed, pad: 1,
      cands: [[-4, 5, 'end']]
    });
    putLabel(bondSvg, xR + 58, cy, 'EN = ' + b.en.toFixed(1), {
      cls: 'eb-aen', avoid: avoid, placed: placed, pad: 1,
      cands: [[4, 5, 'start']]
    });

    /* Partial charges δ+ / δ− + bond dipole arrow cleanly above cloud contour */
    if (diff > 1e-9) {
      var lNeg = dir < 0;
      putLabel(bondSvg, xL, cy - 58, lNeg ? 'δ−' : 'δ+', {
        cls: lNeg ? 'eb-dneg' : 'eb-dpos', avoid: avoid, placed: placed, pad: 1,
        cands: [[0, -8, 'middle']]
      }).setAttribute('data-atom', a.sym);
      putLabel(bondSvg, xR, cy - 58, lNeg ? 'δ+' : 'δ−', {
        cls: lNeg ? 'eb-dpos' : 'eb-dneg', avoid: avoid, placed: placed, pad: 1,
        cands: [[0, -8, 'middle']]
      }).setAttribute('data-atom', b.sym);

      /* Dipole arrow +───▶ pointing toward δ− */
      var yDip = cy - 72;
      var xFrom = lNeg ? cx + 48 : cx - 48;
      var xTo   = lNeg ? cx - 48 : cx + 48;
      var sgn   = lNeg ? -1 : 1;
      bondSvg.appendChild(K.svg('line', { x1: xFrom, y1: yDip, x2: xTo - sgn * 8, y2: yDip, stroke: 'var(--mut)', 'stroke-width': 1.5 }));
      bondSvg.appendChild(K.svg('line', { x1: xFrom + sgn * 6, y1: yDip - 5, x2: xFrom + sgn * 6, y2: yDip + 5, stroke: 'var(--mut)', 'stroke-width': 1.5 }));
      bondSvg.appendChild(K.svg('polygon', {
        points: [xTo + ',' + yDip, (xTo - sgn * 8) + ',' + (yDip - 4.5), (xTo - sgn * 8) + ',' + (yDip + 4.5)].join(' '),
        fill: 'var(--mut)'
      }));
    } else {
      putLabel(bondSvg, cx, cy - 54, 'no dipole (ΔEN = 0)', {
        cls: 'eb-note', avoid: avoid, placed: placed, pad: 1,
        cands: [[0, -8, 'middle']]
      });
    }
  } else {
    /* Ionic (ΔEN ≥ 2.0): complete electron transfer → [cation]ⁿ⁺ [anion]ᵐ⁻ */
    var xL2 = cx - 98, xR2 = cx + 98;
    var rIsAn = dir >= 0;
    var rL2 = rIsAn ? 26 : 34;
    var rR2 = rIsAn ? 34 : 26;
    var qL = rIsAn ? (CAT_Q[a.grp] || 1) : (AN_Q[a.grp] || 1);
    var qR = rIsAn ? (AN_Q[b.grp] || 1)  : (CAT_Q[b.grp] || 1);

    /* Atom circles inside square brackets */
    bondSvg.appendChild(K.svg('circle', {
      'class': 'eb-atom eb-ion-circle', cx: xL2, cy: cy, r: rL2,
      fill: 'var(--card)', stroke: rIsAn ? 'var(--pos)' : 'var(--neg)', 'stroke-width': 2.4
    }));
    bondSvg.appendChild(K.svg('circle', {
      'class': 'eb-atom eb-ion-circle', cx: xR2, cy: cy, r: rR2,
      fill: 'var(--card)', stroke: rIsAn ? 'var(--neg)' : 'var(--pos)', 'stroke-width': 2.4
    }));

    putLabel(bondSvg, xL2, cy, a.sym, { cls: 'eb-asym', avoid: avoid, placed: placed, pad: 1, cands: [[0, 7, 'middle']] });
    putLabel(bondSvg, xR2, cy, b.sym, { cls: 'eb-asym', avoid: avoid, placed: placed, pad: 1, cands: [[0, 7, 'middle']] });

    circleBoxSegs(xL2, cy, rL2).forEach(function (sg) { avoid.push(sg); });
    circleBoxSegs(xR2, cy, rR2).forEach(function (sg) { avoid.push(sg); });

    /* Transferred electron pair fully on the anion side */
    var xAn = rIsAn ? xR2 : xL2;
    var xDot = rIsAn ? (xR2 - 22) : (xL2 + 22);
    bondSvg.setAttribute('data-xpair', xDot);
    bondSvg.setAttribute('data-xl', xL2);
    bondSvg.setAttribute('data-xr', xR2);
    [-7, 7].forEach(function (dy) {
      bondSvg.appendChild(K.svg('circle', {
        'class': 'eb-edot', cx: xDot, cy: cy + dy, r: 4.8,
        fill: 'var(--neg)', stroke: 'var(--card)', 'stroke-width': 1.4
      }));
    });
    placed.push({ x: xDot - 6, y: cy - 13, w: 12, h: 26 });

    /* Square brackets [ ] around each ion */
    function addBrackets(xc) {
      var hw = 43, hh = 41, arm = 9;
      var dL = 'M ' + (xc - hw + arm) + ' ' + (cy - hh) + ' L ' + (xc - hw) + ' ' + (cy - hh) +
               ' L ' + (xc - hw) + ' ' + (cy + hh) + ' L ' + (xc - hw + arm) + ' ' + (cy + hh);
      var dR = 'M ' + (xc + hw - arm) + ' ' + (cy - hh) + ' L ' + (xc + hw) + ' ' + (cy - hh) +
               ' L ' + (xc + hw) + ' ' + (cy + hh) + ' L ' + (xc + hw - arm) + ' ' + (cy + hh);
      bondSvg.appendChild(K.svg('path', { 'class': 'eb-brk', d: dL, fill: 'none', stroke: 'var(--fg)', 'stroke-width': 2.3 }));
      bondSvg.appendChild(K.svg('path', { 'class': 'eb-brk', d: dR, fill: 'none', stroke: 'var(--fg)', 'stroke-width': 2.3 }));
      avoid.push(
        [xc - hw, cy - hh, xc - hw + arm, cy - hh], [xc - hw, cy + hh, xc - hw + arm, cy + hh], [xc - hw, cy - hh, xc - hw, cy + hh],
        [xc + hw - arm, cy - hh, xc + hw, cy - hh], [xc + hw - arm, cy + hh, xc + hw, cy + hh], [xc + hw, cy - hh, xc + hw, cy + hh]
      );
    }
    addBrackets(xL2);
    addBrackets(xR2);

    /* Superscript charges outside top-right of each bracket */
    putLabel(bondSvg, xL2 + 47, cy - 30, chgPlain(qL, rIsAn), {
      cls: rIsAn ? 'eb-chg-p' : 'eb-chg-n', avoid: avoid, placed: placed, pad: 1,
      cands: [[2, 0, 'start']]
    });
    putLabel(bondSvg, xR2 + 47, cy - 30, chgPlain(qR, !rIsAn), {
      cls: rIsAn ? 'eb-chg-n' : 'eb-chg-p', avoid: avoid, placed: placed, pad: 1,
      cands: [[2, 0, 'start']]
    });

    /* Curved dashed electron-transfer arrow above */
    var xCat = rIsAn ? xL2 : xR2;
    var sgn2 = rIsAn ? 1 : -1;
    var xSt = xCat + sgn2 * 16, xEn = xAn - sgn2 * 18;
    bondSvg.appendChild(K.svg('path', {
      d: 'M ' + xSt + ' ' + (cy - 44) + ' Q ' + cx + ' ' + (cy - 64) + ' ' + (xEn - sgn2 * 6) + ' ' + (cy - 45),
      fill: 'none', stroke: 'var(--acc)', 'stroke-width': 1.6, 'stroke-dasharray': '4 3'
    }));
    bondSvg.appendChild(K.svg('polygon', {
      points: [xEn + ',' + (cy - 43), (xEn - sgn2 * 9) + ',' + (cy - 44), (xEn - sgn2 * 6) + ',' + (cy - 51)].join(' '),
      fill: 'var(--acc)'
    }));
    avoid.push([xSt, cy - 44, cx, cy - 55], [cx, cy - 55, xEn, cy - 43]);

    putLabel(bondSvg, cx, cy - 58, 'electron transfer', {
      cls: 'eb-note', avoid: avoid, placed: placed, pad: 1,
      cands: [[0, -8, 'middle']]
    });

    /* Unicode bracketed ion labels underneath */
    var ionL = '[' + a.sym + ']' + chgSup(qL, rIsAn);
    var ionR = '[' + b.sym + ']' + chgSup(qR, !rIsAn);
    putLabel(bondSvg, xL2, cy + 45, ionL, {
      cls: 'eb-ionl', avoid: avoid, placed: placed, pad: 1,
      cands: [[0, 22, 'middle']]
    });
    putLabel(bondSvg, xR2, cy + 45, ionR, {
      cls: 'eb-ionl', avoid: avoid, placed: placed, pad: 1,
      cands: [[0, 22, 'middle']]
    });

    /* Outer EN readouts */
    putLabel(bondSvg, xL2 - 50, cy, 'EN = ' + a.en.toFixed(1), {
      cls: 'eb-aen', avoid: avoid, placed: placed, pad: 1,
      cands: [[-4, 5, 'end']]
    });
    putLabel(bondSvg, xR2 + 64, cy, 'EN = ' + b.en.toFixed(1), {
      cls: 'eb-aen', avoid: avoid, placed: placed, pad: 1,
      cands: [[4, 5, 'start']]
    });
  }
}

/* ---------------- Verdict & Bottom Caption ---------------- */
function pairKey(s1, s2) {
  var keys = Object.keys(PRESETS);
  for (var i = 0; i < keys.length; i++) {
    var p = PRESETS[keys[i]];
    if ((p[0] === s1 && p[1] === s2) || (p[0] === s2 && p[1] === s1)) return keys[i];
  }
  return null;
}

function verdictHtml(z, diff) {
  var d = fmtDiff(diff);
  if (z === 'nonpolar') {
    return '<b>结论：non-polar covalent</b>（ΔEN = 0）— bonding pair 被两个 nuclei 平均共享，no ionic character。';
  }
  if (z === 'polar') {
    return '<b>结论：covalent（polar covalent）</b>（ΔEN = ' + d + '，below 1.0）— bonding pair 偏向 electronegativity 较大的 atom（δ−），ΔEN 越大越 polar。';
  }
  if (z === 'intermediate') {
    return '<b>结论：intermediate — 不考</b>（ΔEN = ' + d + '，1.0 – 2.0）— 讲义：<i>not entirely covalent… out of syllabus</i>；syllabus 写明 covalent character in ionic compounds <b>will not be assessed</b>。';
  }
  return '<b>结论：ionic</b>（ΔEN = ' + d + '，2.0 or more）— electron 转移形成带相反电荷的 cation 与 anion（ionic bonding）。';
}

function captionHtml(a, b, diff, z, pkey) {
  if (pkey === 'Cl-Cl') {
    return '<b>Cl–Cl</b>：两个 chlorine atoms 的 electronegativity 相同（3.0 − 3.0 = 0），bonding pair 位于正中、平均共享 → <b>non-polar covalent bond</b>（no ionic character）。';
  }
  if (pkey === 'C-H') {
    return '<b>C–H</b>：ΔEN = 2.5 − 2.1 = 0.4（below 1.0）→ <b>covalent bond</b>；C 略带 δ−、H 略带 δ+，polarity 很弱。';
  }
  if (pkey === 'H-Cl') {
    return '<b>H–Cl</b>：ΔEN = 3.0 − 2.1 = 0.9（below 1.0）→ <b>polar covalent bond</b>；Cl 的 electronegativity 更大，把 bonding pair 明显拉向自己而带 <b>δ−</b>，H 带 <b>δ+</b>。';
  }
  if (pkey === 'Al-Cl') {
    return '<b>Al–Cl</b>：虽然是 <b>metal + non-metal</b>，但 ΔEN = 3.0 − 1.5 = 1.5 &lt; 2.0（落在 1.0 – 2.0 不考区）→ <b>不是 ionic</b>，AlCl₃ 实际是 <b>covalent</b> molecule（低温下聚成 Al₂Cl₆ dimer）。';
  }
  if (pkey === 'Na-Cl') {
    return '<b>Na–Cl</b>：ΔEN = 3.0 − 0.9 = 2.1（≥ 2.0）→ <b>ionic bonding</b>；Na 把外层 electron 转移给 Cl，形成 <b>[Na]⁺</b> cation 与 <b>[Cl]⁻</b> anion。';
  }
  if (pkey === 'Mg-O') {
    return '<b>Mg–O</b>：ΔEN = 3.5 − 1.2 = 2.3（≥ 2.0）→ <b>ionic bonding</b>；Mg 失去 2 个 electrons 形成 <b>[Mg]²⁺</b>，O 得到 2 个 electrons 形成 <b>[O]²⁻</b>。';
  }
  var hi = a.en >= b.en ? a : b, lo = a.en >= b.en ? b : a;
  var d = fmtDiff(diff);
  var bothMetal = a.metal && b.metal;
  var mNote = bothMetal ? '（注：纯金属或合金在凝聚态实际形成 metallic bonding，见 3.3；ΔEN 尺用于比较 covalent 与 ionic bonding。）' : '';
  if (z === 'nonpolar') {
    return '<b>' + a.sym + '–' + b.sym + '</b>：' + (a.sym === b.sym ? '同种 atom ' : '两种 atoms 的 Pauling ') +
      'electronegativity 相等（' + a.en.toFixed(1) + ' − ' + b.en.toFixed(1) + ' = 0），bonding pair 平均共享 → <b>non-polar covalent bond</b>。' + mNote;
  }
  if (z === 'polar') {
    return '<b>' + a.sym + '–' + b.sym + '</b>：ΔEN = ' + hi.en.toFixed(1) + ' − ' + lo.en.toFixed(1) + ' = ' + d +
      '（below 1.0）→ <b>polar covalent bond</b>；bonding pair 偏向 ' + hi.sym + '（带 <b>δ−</b>），' + lo.sym + ' 带 <b>δ+</b>。' + mNote;
  }
  if (z === 'intermediate') {
    var hfNote = (hi.sym === 'F' && lo.sym === 'H') ? ' H–F 仍是极度 polar 的 covalent molecule，molecules 间有 hydrogen bonding。' : '';
    return '<b>' + a.sym + '–' + b.sym + '</b>：ΔEN = ' + hi.en.toFixed(1) + ' − ' + lo.en.toFixed(1) + ' = ' + d +
      '（1.0 – 2.0 不考区：not entirely covalent，out of syllabus）→ bonding pair 强烈偏向 ' + hi.sym + '（<b>δ−</b>），' + lo.sym + ' 带 <b>δ+</b>。' + hfNote + mNote;
  }
  var qCat = CAT_Q[lo.grp] || 1, qAn = AN_Q[hi.grp] || 1;
  var covExc = (lo.sym === 'B' || lo.grp === 14 || lo.grp === 15)
    ? '（注：按 ΔEN ≥ 2.0 简单判据落在 ionic 区，但 ' + lo.sym + ' 失去多个 electrons 能量代价太高，实际形成 polar covalent molecule。）'
    : '';
  return '<b>' + a.sym + '–' + b.sym + '</b>：ΔEN = ' + hi.en.toFixed(1) + ' − ' + lo.en.toFixed(1) + ' = ' + d +
    '（≥ 2.0）→ <b>ionic bonding</b>；electron 转移后形成 <b>[' + lo.sym + ']' + chgSup(qCat, true) + '</b> 与 <b>[' + hi.sym + ']' + chgSup(qAn, false) + '</b>。' + covExc;
}

/* Displayed pair (keeps last completed pair on SVGs while waiting for 2nd click) */
var dispA = BY_SYM.H, dispB = BY_SYM.Cl;

function update() {
  /* Update Periodic Table cell highlights */
  K.$$(ptEl, '.eb-cell').forEach(function (c) {
    var s = c.getAttribute('data-el');
    var isA = s === selA;
    var isB = phase === 2 && s === selB;
    c.classList.toggle('sel-a', isA);
    c.classList.toggle('sel-b', isB);
    var tag = c.querySelector('.eb-tag');
    tag.textContent = (isA && isB) ? 'A·B' : isA ? 'A' : isB ? 'B' : '';
  });

  var pkey = phase === 2 ? pairKey(selA, selB) : null;
  K.$$($root, '.eb-pre').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-preset') === pkey);
  });
  $('.eb-alnote').classList.toggle('on', pkey === 'Al-Cl');

  var calc = $('.eb-calc'), pairBox = $('.eb-pair'), eqBox = $('.eb-eq'), badge = $('.eb-badge');
  calc.setAttribute('data-phase', phase);

  if (phase === 1) {
    var ea = BY_SYM[selA];
    pairBox.innerHTML = '<span class="eb-chip eb-chip-a">A：' + ea.sym + '（' + ea.en.toFixed(1) + '）</span>' +
      '<span class="eb-wait">→ 请再点表上一格选 B（再点 ' + ea.sym + ' = 同元素 ΔEN 0）</span>';
    eqBox.textContent = '等待选 B…';
    badge.textContent = '选第 2 个元素';
    badge.setAttribute('data-z', 'nonpolar');
    K.fit();
    return;
  }

  dispA = BY_SYM[selA];
  dispB = BY_SYM[selB];
  var hi = Math.max(dispA.en, dispB.en), lo = Math.min(dispA.en, dispB.en);
  var diff = +(hi - lo).toFixed(1);
  var z = zoneOf(diff);

  calc.setAttribute('data-a', dispA.sym);
  calc.setAttribute('data-b', dispB.sym);
  calc.setAttribute('data-den', fmtDiff(diff));
  calc.setAttribute('data-zone', z);

  pairBox.innerHTML =
    '<span class="eb-chip eb-chip-a">A：' + dispA.sym + '（' + dispA.en.toFixed(1) + '）</span>' +
    '<span>+</span>' +
    '<span class="eb-chip eb-chip-b">B：' + dispB.sym + '（' + dispB.en.toFixed(1) + '）</span>';
  eqBox.textContent = 'ΔEN = ' + hi.toFixed(1) + ' − ' + lo.toFixed(1) + ' = ' + fmtDiff(diff);

  var zNames = {
    nonpolar: 'non-polar covalent',
    polar: 'covalent (polar)',
    intermediate: 'intermediate — 不考',
    ionic: 'ionic'
  };
  badge.textContent = zNames[z];
  badge.setAttribute('data-z', z);

  drawRuler(diff, z);
  drawBond(dispA, dispB, diff, z);
  $('.eb-verdict').innerHTML = verdictHtml(z, diff);
  $('.eb-cap').innerHTML = captionHtml(dispA, dispB, diff, z, pkey);
  K.fit();
}

update();

/* Redraw both SVGs 1:1 whenever container width changes */
var lastW = rulerSvg.getBoundingClientRect().width;
if (window.ResizeObserver) new ResizeObserver(function () {
  var w = rulerSvg.getBoundingClientRect().width;
  if (Math.abs(w - lastW) < 1) return;
  lastW = w;
  var hi = Math.max(dispA.en, dispB.en), lo = Math.min(dispA.en, dispB.en);
  var diff = +(hi - lo).toFixed(1), z = zoneOf(diff);
  drawRuler(diff, z);
  drawBond(dispA, dispB, diff, z);
}).observe(rulerSvg);
</script>
