<h3>Dot-and-cross diagram 画板</h3>
<p class="mut">每个 atom 画一个圆（outer shell）。covalent bond 的两个圆<b>相交</b>，shared pair 画在相交区；不同 atom 的 electrons 用不同符号（• × ○ △）。
  ionic compound 的每个 ion 单独画，加 <b>square brackets</b> 和 charge。先选一类，再选一个物种。</p>

<div class="row dc-groups">
  <button data-g="ion">ionic</button>
  <button data-g="cov">covalent</button>
  <button data-g="dat">coordinate (dative covalent)</button>
</div>
<div class="dc-chips"></div>

<div class="row dc-opts">
  <label><input type="checkbox" class="dc-exam"> 考卷模式（先藏起 electrons，自己画完再逐步对答案）</label>
  <span class="dc-ionopts">
    <label><input type="checkbox" class="dc-new"> show new outer shell（cation）</label>
    <label><input type="checkbox" class="dc-all"> all electrons（每个 shell 都画）</label>
    <label class="dc-coefw"><input type="checkbox" class="dc-coef"> 写系数 2（不画两次）</label>
  </span>
  <span class="dc-steps"><button data-step="1">① NH₃ 与 H⁺</button><button data-step="2">② NH₄⁺ 与 Cl⁻</button></span>
</div>

<div class="dc-main">
  <div class="card dc-fig">
    <div class="dc-title"></div>
    <svg class="dc-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="row dc-exambar"><button class="dc-next"></button><span class="faint dc-exhint"></span></div>
    <div class="dc-legend"></div>
    <div class="dc-structw"><div class="dc-cap">结构式（displayed formula）</div><svg class="dc-struct" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
  <div class="card dc-count"></div>
</div>
<div class="card dc-note"></div>

      var p = pos(by[b[0]]), q = pos(by[b[1]]), dx = q[0] - p[0], dy = q[1] - p[1], d = Math.hypot(dx, dy), u = [dx / d, dy / d], v = [-u[1], u[0]], cut = 12;
      var from = b[3] ? (b[3] === b[0] ? p : q) : p, to = b[3] ? (b[3] === b[0] ? q : p) : q;
      var fu = [(to[0] - from[0]) / d, (to[1] - from[1]) / d];
      var a0 = [from[0] + fu[0] * cut, from[1] + fu[1] * cut], a1 = [to[0] - fu[0] * cut, to[1] - fu[1] * cut];
      if (b[3]) {
        S('path', { d: 'M' + a0[0] + ' ' + a0[1] + 'L' + (a1[0] - fu[0] * 6) + ' ' + (a1[1] - fu[1] * 6) }, ssvg, 'dc-ba');
        S('path', { d: 'M' + a1[0] + ' ' + a1[1] + 'L' + (a1[0] - fu[0] * 8 - fu[1] * 4.5) + ' ' + (a1[1] - fu[1] * 8 + fu[0] * 4.5) +
          'L' + (a1[0] - fu[0] * 8 + fu[1] * 4.5) + ' ' + (a1[1] - fu[1] * 8 - fu[0] * 4.5) + 'Z', 'data-arrow': by[b[3]].el + '→' + by[b[3] === b[0] ? b[1] : b[0]].el }, ssvg, 'dc-arwhead');
      } else {
        for (var i = 0; i < b[2]; i++) {
          var o = (i - (b[2] - 1) / 2) * 4.5;
          S('path', { d: 'M' + (a0[0] + v[0] * o) + ' ' + (a0[1] + v[1] * o) + 'L' + (a1[0] + v[0] * o) + ' ' + (a1[1] + v[1] * o) }, ssvg, 'dc-bl');
        }
      }
      avoid.push([a0[0], a0[1], a1[0], a1[1]]);
    });
    var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    P.atoms.forEach(function (a) {
      var p = pos(a), t = S('text', { x: p[0], y: p[1], 'text-anchor': 'middle', 'dominant-baseline': 'central' }, ssvg, 'dc-ssym');
      t.textContent = a.el;
      var bb = t.getBBox(); placed.push({ x: bb.x, y: bb.y, w: bb.width, h: bb.height });
      x0 = Math.min(x0, bb.x); x1 = Math.max(x1, bb.x + bb.width); y0 = Math.min(y0, bb.y); y1 = Math.max(y1, bb.y + bb.height);
    });
    if (P.part.bracket) {
      var bbx = [x0 - 2, y0 - 2, x1 + 2, y1 + 2];
      if (P.atoms.length > 1) { avoid = avoid.concat(bracket(ssvg, bbx)); }
      K.label(ssvg, (P.atoms.length > 1 ? bbx[2] + 7 : x1 - 1), bbx[1] + (P.atoms.length > 1 ? -7 : 9), chgTxt(P.part.bracket), { cls: 'dc-chg', avoid: avoid, placed: placed, cands: [[2, 3, 'start'], [3, 0, 'start']], pad: 0 });
      x1 += 30;
    }
    offs = x1 + 30;
  });
  var bb = ssvg.getBBox(), pad = 6, vb = [bb.x - pad, bb.y - pad, bb.width + 2 * pad, bb.height + 2 * pad];
  ssvg.setAttribute('viewBox', vb.map(function (v) { return v.toFixed(1); }).join(' '));
  ssvg.style.width = (vb[2] * SCALE) + 'px';
}

function mkSvg(mk) {
  var d = { dot: '<circle cx="8" cy="8" r="3.6" class="dc-mk-dot"/>',
    cross: '<path d="M4.6 4.6L11.4 11.4M4.6 11.4L11.4 4.6" class="dc-mk-cross"/>',
    circ: '<circle cx="8" cy="8" r="3.4" class="dc-mk-circ"/>',
    tri: '<path d="M8 3.6L11.8 10.6H4.2Z" class="dc-mk-tri"/>' }[mk];
  return '<svg viewBox="0 0 16 16">' + d + '</svg>';
}
function legend(s, atoms, es, hl, rings) {
  var seen = {}, out = [];
  atoms.forEach(function (a) {
    var key = a.mk + a.el;
    if (seen[key]) return; seen[key] = 1;
    var same = atoms.filter(function (b) { return b.el === a.el && b.mk !== a.mk; }).length;
    var who = a.el + (same && a.tag ? '（' + a.tag + '）' : '');
    if (s.id === 'NH4Cl' && a.el === 'H') who = 'H（含 HCl 的 H）';
    out.push('<span data-mk="' + a.mk + '">' + mkSvg(a.mk) + who + ' 的 electron</span>');
  });
  if (s.g === 'ion' && atoms.some(function (a) { return a.empty; }))
    out.push('<span><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="3 2.5"/></svg>虚线圆 = 已经空了的 outer shell</span>');
  if (hl.length) out.push('<span><svg viewBox="0 0 16 16"><ellipse cx="8" cy="8" rx="7" ry="4.5" class="dc-dat"/></svg>coordinate bond 的 pair（两个都来自 donor atom）</span>');
  if (rings.length) out.push('<span><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" class="dc-ring"/></svg>unpaired electron</span>');
  $('.dc-legend').innerHTML = out.join('');
}

function cnt(id) { return cur.es.filter(function (e) { return e.atoms.indexOf(id) >= 0; }).length; }
function counts(s, atoms, es, bonds) {
  var box = $('.dc-count'), hide = st.exam && st.stage < 2;
  function v(x) { return hide ? '?' : x; }
  if (s.g === 'ion') {
    var rows = [], done = {};
    atoms.forEach(function (a) {
      if (done[a.el]) return; done[a.el] = 1;
      var sh = ionShells(a.el, a.q), cfg = sh.join(','), n = atoms.filter(function (b) { return b.el === a.el; }).length;
      var mult = s.ions.filter(function (r) { return r[0] === a.el; })[0][2];
      rows.push('<tr data-ion="' + a.el + '"><td><b>' + a.el + supQ(a.q) + '</b>' + (mult > 1 ? ' ×' + mult : '') + '<br><span class="faint">' +
        (a.q > 0 ? '失去 ' + a.q : '得到 ' + (-a.q)) + ' 个 electron' + (a.q === 1 || a.q === -1 ? '' : 's') + '</span></td>' +
        '<td class="dc-v" data-k="drawn">' + v(cnt(a.id)) + '</td><td data-k="cfg">' + v(cfg + (NOBLE[cfg] ? '（= ' + NOBLE[cfg] + '）' : '')) + '</td></tr>');
    });
    box.innerHTML = '<h4>数一数</h4><table><tr><th>ion</th><th>图上 electrons</th><th>shells</th></tr>' + rows.join('') + '</table>' +
      '<p class="faint">' + (st.all ? '现在画的是 <b>all electrons</b>（每个 shell）。' : '默认只画 outer shell；cation 失去了整个外层，括号里是空的。') + '</p>';
    return;
  }
  var c = s.central, ce = cnt(c), ca = atoms.filter(function (a) { return a.id === c; })[0];
  var bp = cur.es.filter(function (e) { return e.kind === 'bond' && e.atoms.indexOf(c) >= 0; }).length / 2;
  var lp = cur.es.filter(function (e) { return e.kind === 'lp' && e.atoms[0] === c; }).length / 2;
  var one = cur.es.filter(function (e) { return e.kind === 'one'; }).length;
  var dat = cur.es.filter(function (e) { return e.dative; }).length / 2;
  var tag = ca.el === 'H' && ce === 2 ? ['duo', 'duplet（H 只要 2 个）'] : ce % 2 ? ['rad', 'odd electron → radical'] :
    ce === 8 ? ['oct', 'octet'] : ce > 8 ? ['exp', 'expanded octet'] : ['def', 'electron deficient'];
  var who = s.centralTxt || ('central atom ' + ca.el);
  if (['H2', 'Cl2', 'O2', 'N2'].indexOf(s.id) >= 0) who = '每个 ' + ca.el;
  var trs = [
    ['ce', who + ' 外层 electrons', v(ce) + (hide ? '' : ' <span class="dc-tag ' + tag[0] + '">' + tag[1] + '</span>')],
    ['bp', 'bonding pairs（' + ca.el + ' 周围）', v(bp)],
    ['lp', 'lone pairs（' + ca.el + ' 上）', v(lp)]];
  if (one) trs.push(['one', 'unpaired electrons', v(one)]);
  if (dat) trs.push(['dat', 'coordinate bonds', v(dat)]);
  trs.push(['tot', '图上 outer electrons 总数', v(cur.es.length)]);
  box.innerHTML = '<h4>数一数</h4><table>' + trs.map(function (r) { return '<tr data-k="' + r[0] + '"><td>' + r[1] + '</td><td class="dc-v">' + r[2] + '</td></tr>'; }).join('') + '</table>' +
    (hide ? '<p class="faint">考卷模式：全部显示后才给数字。</p>' : '');
  box.setAttribute('data-ce', ce); box.setAttribute('data-bp', bp); box.setAttribute('data-lp', lp); box.setAttribute('data-tot', cur.es.length);
}

function examBar(s) {
  var bar = $('.dc-exambar'), b = $('.dc-next');
  bar.classList.toggle('show', st.exam);
  var ion = s.g === 'ion';
  b.textContent = st.stage === 0 ? (ion ? '下一步：显示转移来的 electrons' : '下一步：显示 shared pairs') :
    st.stage === 1 ? (ion ? '下一步：显示其余 electrons' : '下一步：显示 lone pairs') : '再藏起来';
  $('.dc-exhint').textContent = st.stage === 0 ? '先在纸上画，再对答案' : st.stage === 1 ? (ion ? '× 是从 metal 转移来的' : '相交区里的就是 shared pairs') : '';
}

function note(s) {
  var h = '<p>' + s.note + '</p>';
  if (s.ms) h += '<div class="dc-ms"><div><b>mark scheme</b>' + (s.src ? ' <span class="dc-src">' + s.src + '</span>' : '') + '</div>' +
    s.ms.map(function (m) { return '<div>' + (m[0] ? '<b class="dc-m">' + m[0] + '</b> ' : '· ') + m[1] + '</div>'; }).join('') + '</div>';
  else if (s.src) h += '<p class="dc-src">' + s.src + '</p>';
  $('.dc-note').innerHTML = h;
}

/* ---------------- controls ---------------- */
function chips() {
  var box = $('.dc-chips'); box.innerHTML = '';
  var groups = st.g === 'cov' ? [['o', 'octet（每个 atom 外层 8 个，H 2 个）'], ['x', 'octet 的例外：electron deficient / expanded octet / odd electron']] : [[null, null]];
  groups.forEach(function (gr) {
    if (gr[1]) box.appendChild(K.el('div', { 'class': 'dc-sub' }, gr[1]));
    var row = K.el('div', { 'class': 'dc-chiprow' });
    SP.filter(function (s) { return s.g === st.g && (!gr[0] || s.sub === gr[0]); }).forEach(function (s) {
      var b = K.el('button', { 'data-sp': s.id, title: s.name }, s.f);
      b.addEventListener('click', function () { pick(s.id); });
      row.appendChild(b);
    });
    box.appendChild(row);
  });
}
function sync() {
  var s = spec();
  K.$$($root, '.dc-groups button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-g') === st.g); });
  K.$$($root, '.dc-chips button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-sp') === st.sp); });
  $('.dc-ionopts').style.display = s.g === 'ion' ? '' : 'none';
  $('.dc-steps').style.display = s.steps ? '' : 'none';
  K.$$($root, '.dc-steps button').forEach(function (b) { b.classList.toggle('on', +b.getAttribute('data-step') === st.step); });
  var two = s.g === 'ion' && s.ions.some(function (r) { return r[2] > 1; });
  $('.dc-coef').disabled = !two; $('.dc-coefw').classList.toggle('dc-off', !two);
  $('.dc-new').disabled = st.all; $('.dc-new').parentNode.classList.toggle('dc-off', st.all);
  $('.dc-title').innerHTML = s.f + '<small>' + s.name + '</small>';
  note(s);
  render();
}
function pick(id) { st.sp = id; st.step = 1; if (st.exam) st.stage = 0; sync(); }
K.$$($root, '.dc-groups button').forEach(function (b) {
  b.addEventListener('click', function () {
    st.g = b.getAttribute('data-g'); chips();
    pick(SP.filter(function (s) { return s.g === st.g; })[0].id);
  });
});
$('.dc-exam').addEventListener('change', function () { st.exam = this.checked; st.stage = st.exam ? 0 : 2; sync(); });
$('.dc-new').addEventListener('change', function () { st.nw = this.checked; sync(); });
$('.dc-all').addEventListener('change', function () { st.all = this.checked; sync(); });
$('.dc-coef').addEventListener('change', function () { st.coef = this.checked; sync(); });
K.$$($root, '.dc-steps button').forEach(function (b) { b.addEventListener('click', function () { st.step = +b.getAttribute('data-step'); sync(); }); });
$('.dc-next').addEventListener('click', function () { st.stage = (st.stage + 1) % 3; sync(); });

$root.__dc = { SP: SP, st: st, cur: function () { return cur; } };
chips(); sync();
</script>
