<h3>Polar 与 non-polar molecule：bond dipoles 抵消吗？ <span class="faint">拖动旋转 · 滚轮缩放</span></h3>
<div class="row po-mols"><span class="po-rl">molecule</span></div>
<div class="row po-tools">
  <span class="po-rl">显示</span>
  <button class="po-tb on" data-t="bd">bond dipoles</button><button class="po-td on" data-t="dl">δ+ / δ−</button><button class="po-tn on" data-t="net">net dipole</button>
  <button class="po-ta" data-t="auto">直接显示答案</button>
  <span class="faint">｜</span>
  <button data-3d="reset">复位视角</button><button data-3d="spin">自动旋转</button>
</div>
<div class="po-main">
  <div class="stage"><div class="hud"><span class="po-kbd">━▶ bond dipole</span>（ΔEN 越大越长，指向 δ−）<span class="po-kn"> · <b>━▶ net dipole</b>（矢量和）</span><span class="po-klp"> · 淡紫 = lone pair</span>
    <div class="po-res"></div></div></div>
  <div class="card po-info"></div>
</div>
<div class="fallback card"><p><b>3D 没有加载</b>（<span class="why"></span>），下面是两个平面示意：CO₂ 的两个 bond dipoles 方向相反、抵消；H₂O 的两个不抵消，合成指向 O 一侧。上面的「先猜再看」照常可用。</p>
  <div class="po-fb"></div>
</div>
<style>

<script>
/* Pauling electronegativities from the notes (3.1 C) */
var PO_EN = { H: 2.1, B: 2.0, C: 2.5, N: 3.0, O: 3.5, F: 4.0, S: 2.5, Cl: 3.0 };
var PO_BL = { H: 1.2, F: 1.7, O: 1.35, Cl: 1.65 };   /* scene bond lengths from the central atom */
/* bond dipole length = PO_KB0 + PO_KBD × ΔEN: grows with ΔEN but never a stub — strictly ∝ ΔEN a C–Cl (0.5) arrow is
   a quarter of a B–F (2.0) one and reads as a blob beside a 1.65-long bond. net dipole: PO_KNET per unit |net| */
var PO_KB0 = 0.55, PO_KBD = 0.6, PO_KNET = 0.65;
var PO_NP = 0.45;                                       /* ΔEN below this is "virtually non-polar" (C–H, 0.4) */
function poD(a, b) { return (Math.round(Math.abs(PO_EN[a] - PO_EN[b]) * 10) / 10).toFixed(1); }
function poDen(a, b) { var hi = PO_EN[a] >= PO_EN[b] ? a : b, lo = hi === a ? b : a; return PO_EN[hi].toFixed(1) + ' − ' + PO_EN[lo].toFixed(1) + ' = ' + poD(a, b); }
var PO_CH = 'C–H（' + poDen('C', 'H') + '）virtually non-polar';
/* c = central atom, t = terminal atoms in K3.vsepr slot order (tetrahedral: top first), lp = lone pairs on c */
var PO_M = [
  { id: 'H2', f: 'H₂', pair: ['H', 'H'], L: 0.95, shape: 'linear', polar: false,
    pb: '没有：H–H，ΔEN = 0（两个 atoms 一样）', cc: '没有 bond dipole，无从抵消', concl: 'non-polar',
    note: 'electronegativity 相同 → bonding pair 平均共享，bond 本身就 non-polar。' },
  { id: 'HCl', f: 'HCl', pair: ['H', 'Cl'], L: 1.5, shape: 'linear', polar: true,
    pb: '有：H–Cl（' + poDen('H', 'Cl') + '）', cc: '只有一个 bond dipole，没有别的 dipole 来抵消', concl: 'polar（δ− 在 Cl）' },
  { id: 'CO2', f: 'CO₂', c: 'C', t: ['O', 'O'], lp: 0, dbl: 1, shape: 'linear', polar: false,
    pb: '有：2 × C=O（' + poDen('C', 'O') + '）', cc: '抵消：两个 bond dipoles 大小相等、方向相反（180°）', concl: 'non-polar',
    rule: 1 },
  { id: 'BF3', f: 'BF₃', c: 'B', t: ['F', 'F', 'F'], lp: 0, shape: 'trigonal planar', polar: false,
    pb: '有：3 × B–F（' + poDen('B', 'F') + '，这里最 polar 的 bond）', cc: '抵消：三个 dipoles 互成 120°，对称', concl: 'non-polar', rule: 1 },
  { id: 'CH4', f: 'CH₄', c: 'C', t: ['H', 'H', 'H', 'H'], lp: 0, shape: 'tetrahedral', polar: false,
    pb: '没有：' + PO_CH, cc: '没有 polar bond；就算把 C–H 算上，tetrahedral 对称也会抵消', concl: 'non-polar' },
  { id: 'CCl4', f: 'CCl₄', c: 'C', t: ['Cl', 'Cl', 'Cl', 'Cl'], lp: 0, shape: 'tetrahedral', polar: false,
    pb: '有：4 × C–Cl（' + poDen('C', 'Cl') + '）', cc: '抵消：四个相同的 dipoles 指向 tetrahedron 的四个顶点，对称', concl: 'non-polar', rule: 1 },
  { id: 'CH3Cl', f: 'CH₃Cl', c: 'C', t: ['Cl', 'H', 'H', 'H'], lp: 0, shape: 'tetrahedral', polar: true,
    pb: '有：1 × C–Cl（' + poDen('C', 'Cl') + '）；' + PO_CH, cc: '不抵消：只有一个 C–Cl dipole，C–H 抵消不了它', concl: 'polar（δ− 在 Cl）' },
  { id: 'CHCl3', f: 'CHCl₃', c: 'C', t: ['H', 'Cl', 'Cl', 'Cl'], lp: 0, shape: 'tetrahedral', polar: true,
    pb: '有：3 × C–Cl（' + poDen('C', 'Cl') + '）；' + PO_CH, cc: '不抵消：三个 C–Cl 指向同一侧，没被 C–H 抵消', concl: 'polar（δ− 在 Cl 一侧）',
    note: '同样是 tetrahedral，CCl₄ non-polar 而 CHCl₃ polar：shape 对称不够，四个 bond 还得一样。' },
  { id: 'H2O', f: 'H₂O', c: 'O', t: ['H', 'H'], lp: 2, shape: 'non-linear', polar: true,
    pb: '有：2 × O–H（' + poDen('O', 'H') + '）', cc: '不抵消：两个 dipoles 成 104.5°，合成指向 O 一侧', concl: 'polar（δ− 在 O）', ms: 'h2o' },
  { id: 'NH3', f: 'NH₃', c: 'N', t: ['H', 'H', 'H'], lp: 1, shape: 'pyramidal', polar: true,
    pb: '有：3 × N–H（' + poDen('N', 'H') + '）', cc: '不抵消：三个 dipoles 都向上指向 N，合成指向 N（lone pair 那一侧）', concl: 'polar（δ− 在 N）' },
  { id: 'SCl2', f: 'SCl₂', c: 'S', t: ['Cl', 'Cl'], lp: 2, shape: 'non-linear', polar: true,
    pb: '有：2 × S–Cl（' + poDen('S', 'Cl') + '）', cc: '不抵消：shape non-linear，合成指向两个 Cl 之间', concl: 'polar（δ− 在 Cl 一侧）', ms: 'scl2' },
  { id: 'SF6', f: 'SF₆', c: 'S', t: ['F', 'F', 'F', 'F', 'F', 'F'], lp: 0, shape: 'octahedral', polar: false,
    pb: '有：6 × S–F（' + poDen('S', 'F') + '）', cc: '抵消：每个 S–F 对面都有一个方向相反的 S–F', concl: 'non-polar', rule: 1 }
];
var PO_BY = {}; PO_M.forEach(function (m) { PO_BY[m.id] = m; });
/* recommended view [rx, ry] */
/* tetrahedral / pyramidal: no terminal atom straight behind (or in front of) the central atom, so every bond —
   and the bond-dipole arrow beside it — is at most ~⅓ foreshortened and the net arrow misses the front atom */
var PO_VIEW = { H2: [0.2, -0.3], HCl: [0.2, -0.3], CO2: [0.22, -0.3], BF3: [0.25, -0.3], CH4: [0.45, 0.32], CCl4: [0.45, 0.32],
                CH3Cl: [0.45, 0.32], CHCl3: [0.45, 0.32], H2O: [0.2, -0.45], NH3: [0.45, 0.3], SCl2: [0.2, -0.45], SF6: [0.5, -0.8] };

var po = { id: 'CHCl3', bd: true, dl: true, net: true, auto: false, guess: {} };

/* ---------- pure geometry: atoms, bonds, bond dipoles, net dipole (no three.js) ---------- */
function poAdd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function poSubV(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function poMul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function poDot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function poLen(a) { return Math.sqrt(poDot(a, a)); }
function poUnit(a) { var l = poLen(a) || 1; return poMul(a, 1 / l); }
function poCross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }

function poGeom(id) {
  var m = PO_BY[id], g = { atoms: [], bonds: [], lps: [] };
  if (m.pair) {
    g.atoms = [{ el: m.pair[0], p: [-m.L / 2, 0, 0] }, { el: m.pair[1], p: [m.L / 2, 0, 0] }];
    g.bonds = [[0, 1, 1]];
  } else {
    var d = K3.vsepr(m.t.length, m.lp, true);
    g.atoms.push({ el: m.c, p: [0, 0, 0] });
    d.bonds.forEach(function (v, i) {
      var el = m.t[i], L = PO_BL[el];
      g.atoms.push({ el: el, p: poMul(v, L) });
      g.bonds.push([0, i + 1, m.dbl ? 2 : 1, [0, 0, 1]]);
    });
    d.lps.forEach(function (v) { g.lps.push({ at: 0, dir: v, len: 0.85 }); });
  }
  /* bond dipoles: tail at the less electronegative atom, head towards the more electronegative (δ−) */
  g.dip = []; g.np = []; g.q = g.atoms.map(function () { return 0; });
  var net = [0, 0, 0];
  g.bonds.forEach(function (b) {
    var A = g.atoms[b[0]], B = g.atoms[b[1]], den = Math.abs(PO_EN[A.el] - PO_EN[B.el]);
    if (den < 1e-9) return;
    if (den < PO_NP) { g.np.push(b); return; }
    var from = PO_EN[A.el] < PO_EN[B.el] ? b[0] : b[1], to = from === b[0] ? b[1] : b[0];
    var u = poUnit(poSubV(g.atoms[to].p, g.atoms[from].p)), v = poMul(u, den);
    g.dip.push({ from: from, to: to, den: den, u: u, v: v, bond: b });
    g.q[from] += den; g.q[to] -= den;
    net = poAdd(net, v);
  });
  g.net = net.map(function (x) { return Math.abs(x) < 1e-9 ? 0 : x; });
  g.netLen = poLen(g.net);
  /* centre the molecule on its atoms so it turns about its middle */
  var c = [0, 0, 0];
  g.atoms.forEach(function (a) { c = poAdd(c, a.p); });
  g.c = poMul(c, 1 / g.atoms.length);
  return g;
}
/* where the bond-dipole arrows go: beside each bond, pushed away from the molecule's other bonds; when
   the others cancel (CO₂, BF₃, tetrahedral, octahedral) to the side seen at the default view, upward */
function poArrows(g, view) {
  var cx = Math.cos(view[0]), sx = Math.sin(view[0]), cy = Math.cos(view[1]), sy = Math.sin(view[1]);
  /* inverse of the default rotation (Rx(rx)·Ry(ry), three.js 'XYZ') applied to world z (view) and y (up) */
  function inv(w) { var x = w[0], y = w[1] * cx + w[2] * sx, z = -w[1] * sx + w[2] * cx; return [x * cy - z * sy, y, x * sy + z * cy]; }
  var vw = inv([0, 0, 1]), up = inv([0, 1, 0]);
  return g.dip.map(function (d) {
    var A = g.atoms[d.from].p, B = g.atoms[d.to].p, u = d.u, others = [0, 0, 0];
    var ctr = d.bond[0];
    g.bonds.forEach(function (b) { if (b !== d.bond && (b[0] === ctr)) others = poAdd(others, poUnit(poSubV(g.atoms[b[1]].p, g.atoms[b[0]].p))); });
    var mine = poUnit(poSubV(g.atoms[d.bond[1]].p, g.atoms[d.bond[0]].p));
    /* candidate sides all round the bond: keep away from the other bonds of the same atom, stay side-on
       to the default view (an arrow in front of its bond would hide it), and prefer up */
    var oth = [];
    g.bonds.forEach(function (b) { if (b !== d.bond && b[0] === ctr) oth.push(poUnit(poSubV(g.atoms[b[1]].p, g.atoms[b[0]].p))); });
    var e1 = poCross(mine, Math.abs(mine[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]); e1 = poUnit(e1); var e2 = poCross(mine, e1), off = null, bestS = 1e9;
    for (var k = 0; k < 72; k++) {
      var t = k * Math.PI / 36, o = poAdd(poMul(e1, Math.cos(t)), poMul(e2, Math.sin(t)));
      var sc = 1.2 * Math.abs(poDot(o, vw)) - 0.08 * poDot(o, up);
      oth.forEach(function (b) { sc = Math.max(sc, sc + 0.9 * Math.max(0, poDot(o, b))); });
      if (sc < bestS - 1e-9) { bestS = sc; off = o; }
    }
    /* planar, 3 or more bonds round the centre (BF₃): every arrow on the same rotational side of its bond, so
       neighbouring arrows sit on opposite sides of the gap between them and their tails never meet at B */
    if (oth.length >= 2 && g.lps.length === 0) {
      var nrm = poCross(oth[0], oth[1]);
      if (poLen(nrm) > 1e-6 && Math.abs(poDot(poUnit(nrm), mine)) < 1e-6) {
        nrm = poUnit(nrm); if (poDot(nrm, vw) < 0) nrm = poMul(nrm, -1);
        off = poUnit(poCross(mine, nrm));
      }
    }
    var ra = K3.ARAD[g.atoms[d.from].el] || 0.3, rb = K3.ARAD[g.atoms[d.to].el] || 0.3;
    var D = Math.max(ra, rb) + 0.1, L = PO_KB0 + PO_KBD * d.den, tc = g.atoms.length > 2 ? 0.6 : 0.5;
    var P0 = g.atoms[d.bond[0]].p, P1 = g.atoms[d.bond[1]].p;
    var mid = poAdd(poAdd(P0, poMul(poSubV(P1, P0), tc)), poMul(off, D));
    return { s: poAdd(mid, poMul(u, -L / 2)), e: poAdd(mid, poMul(u, L / 2)), from: d.from, to: d.to, den: d.den };
  });
}
/* net dipole arrow along the vector sum. With a central atom it never crosses that atom: it ends at its
   surface when the central atom is δ− (H₂O, NH₃: from between the H atoms up to O / N) and starts at its
   surface when it is δ+ (SCl₂, CHCl₃, CH₃Cl: away towards the Cl side). HCl: below the bond. */
function poNetArrow(g) {
  if (g.netLen < 1e-6) return null;
  var u = poUnit(g.net), L = 0.75 + PO_KNET * g.netLen, s, e;   /* grows with |net|; never a stub */
  if (g.atoms.length === 2) {
    var mid = poAdd(poMul(poAdd(g.atoms[0].p, g.atoms[1].p), 0.5), [0, -0.62, 0]);
    s = poAdd(mid, poMul(u, -L / 2)); e = poAdd(mid, poMul(u, L / 2));
  } else {
    var c = g.atoms[0].p, r = (K3.ARAD[g.atoms[0].el] || 0.3) + 0.06;
    if (g.q[0] < 0) { e = poAdd(c, poMul(u, -r)); s = poAdd(e, poMul(u, -L)); }
    else { s = poAdd(c, poMul(u, r)); e = poAdd(s, poMul(u, L)); }
  }
  return { s: s, e: e };
}

/* ---------- controls ---------- */
var poBox = $root.querySelector('.po-info');
PO_M.forEach(function (m) {
  var b = K.el('button', { 'data-m': m.id }, m.f + '<i></i>');
  $root.querySelector('.po-mols').appendChild(b);
  b.addEventListener('click', function () { po.id = m.id; poUpdate(true); });
});
$root.querySelectorAll('.po-tools [data-t]').forEach(function (b) {
  b.addEventListener('click', function () { var k = b.getAttribute('data-t'); po[k] = !po[k]; poUpdate(false); });
});
function poShown() { return po.auto || po.guess[po.id] != null; }

function poInfo() {
  var m = PO_BY[po.id], g = poGeom(po.id), shown = poShown(), gs = po.guess[po.id];
  var h = '<div class="po-f">' + m.f + '</div>' +
    '<p class="po-ask">这个 molecule 是 polar 还是 non-polar？先猜，再看 net dipole。</p>' +
    '<div class="po-gb"><button data-g="polar">polar</button><button data-g="non-polar">non-polar</button></div>' +
    '<p class="po-verdict"></p>' +
    '<table><tbody>' +
    '<tr><td>polar bonds?</td><td class="po-pb">' + m.pb + '</td></tr>' +
    '<tr><td>shape</td><td class="po-sh"><b>' + m.shape + '</b></td></tr>' +
    (shown ? '<tr><td>bond dipoles 抵消？</td><td class="po-cc">' + m.cc + '</td></tr>' +
             '<tr><td>结论</td><td class="po-cl"><b class="' + (m.polar ? 'po-pol' : 'po-npol') + '">' + m.concl + '</b></td></tr>' : '') +
    '</tbody></table>';
  h += '<p class="po-hint">dipole 箭头的画法：箭头指向 δ− 一端，尾部一小横（像 +）在 δ+ 一端。</p>';
  if (!shown) h += '<p class="po-hint">提示：看 3D 图里的橙色 bond dipole 箭头——它们在空间里会不会互相抵消、合起来等于 0？</p>';
  else {
    if (m.note) h += '<p class="po-hint">' + m.note + '</p>';
    if (m.rule) h += '<p class="po-rule"><b>not all molecules with polar bonds are polar molecules</b>——对称的 shape 让 bond dipoles 抵消。</p>';
    if (m.ms === 'scl2') h += '<p class="po-ms"><b>判分</b>（9701/21 May/June 2026 Q1(c)(ii)）：在 SCl₂ 上标 dipoles，S 写 <b>δ+</b> AND 两个 Cl 都写 <b>δ−</b>；只写 δ 不写正负号 → 拒绝。</p>';
    if (m.ms === 'scl2' || m.ms === 'h2o') h += '<p class="po-ms"><b>判分</b>：「H₂O has a greater dipole moment than SCl₂」的解释是 <b>electronegativity difference (between H and O) is greater (than S and Cl)</b>（O–H ' + poD('O', 'H') + ' vs S–Cl ' + poD('S', 'Cl') + '）。写 "oxygen is more electronegative than chlorine" 不给分——要比的是差值。</p>';
  }
  var done = Object.keys(po.guess), ok = done.filter(function (k) { return po.guess[k] === PO_BY[k].polar; }).length;
  h += '<p class="po-score">已猜 ' + done.length + ' / ' + PO_M.length + '，对 ' + ok + ' 个' + (po.auto ? '（「直接显示答案」开着，猜了照样判分）' : '') + '</p>';
  poBox.innerHTML = h;
