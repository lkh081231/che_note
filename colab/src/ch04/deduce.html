<h3>推断 structure and bonding</h3>

  res.innerHTML = '<div class="v ' + (ok ? 'ok' : 'no') + '" data-verdict="' + (ok ? 'right' : 'wrong') + '">' +
      (ok ? '✓ 正确：' : '✗ 不对：') + 'structure ' + (okS ? '✓' : '✗') + '，bonding ' + (okB ? '✓' : '✗') + '</div>' +
    '<div>正确答案：<b class="dd-ans">' + SNAME[c.s] + '</b> structure，<b>' + BNAME[c.b] + '</b> bonding' +
      (ok ? '' : '（你选的是 ' + SNAME[st.s] + ' · ' + BNAME[st.b] + '）') + '</div>' +
    '<div style="margin-top:6px">写成两个得分点，每一分都是「结论 AND 证据」：</div>' +
    '<ul><li><span class="m">M1</span>' + c.m1 + '</li><li><span class="m">M2</span>' + c.m2 + '</li></ul>' +
    '<div class="faint">' + c.ms + '</div>' +
    '<div class="trap"><b>易错点</b>　' + c.trap + '</div>';
  res.classList.add('show');
  litFig(c, st.s);
  K.fit();
}
goBtn.addEventListener('click', function () {
  var st = ST[cur], c = CARDS[cur];
  if (!st.s || !st.b) { hint.textContent = '两项都要选（structure 和 bonding）。'; return; }
  if (!st.counted) { st.counted = true; score.n++; if (st.s === c.s && st.b === c.b) score.right++; }
  st.done = true; paint();
});
redoBtn.addEventListener('click', function () { var st = ST[cur]; st.done = false; st.s = st.b = null; paint(); });
$('.dd-prev').addEventListener('click', function () { show(cur - 1); });
$('.dd-next').addEventListener('click', function () { show(cur + 1); });
$('.dd-rand').addEventListener('click', function () {
  var j = cur; while (j === cur) j = Math.floor(rand() * CARDS.length);
  show(j);
});

K.init($root);
drawFig();
show(0);
$root.__dd = { CARDS: CARDS, NODES: NODES, show: show, cur: function () { return cur; }, score: score };
</script>
