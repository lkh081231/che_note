<h3>受力与导电：metal vs ionic</h3>
<div class="tabbar">
  <button type="button" data-tab="force">① 受力：malleable vs brittle</button>
  <button type="button" data-tab="cond">② 导电：electrical conductivity</button>
  <button type="button" class="pr-pause" style="margin-left:auto">⏸ 暂停</button>
</div>

<div data-pane="force">
  <p class="mut">拖动 slider 推动晶格上半部分（0 → 1 个 lattice spacing），对比 <b>giant metallic</b> 与 <b>giant ionic</b> 受切向力时的反应；勾选 <b>alloy</b> 观察加入较大 Zn atoms 后的变化。</p>
  <div class="row pr-fctl">
    <label class="pr-sl">
      <span>上半层位移</span>
      <input type="range" class="pr-disp" min="0" max="1" step="0.01" value="0">
      <code class="pr-dval">0.00</code>
    </label>
    <button type="button" class="pr-pre" data-d="0">0（原位）</button>
    <button type="button" class="pr-pre" data-d="0.5">0.5（半间距）</button>
    <button type="button" class="pr-pre" data-d="1">1.0（到位）</button>
    <label class="pr-al"><input type="checkbox" class="pr-alloy"> <span>alloy（brass：Cu + 较大 Zn atoms）</span></label>
  </div>
  <svg class="pr-svg pr-svg1" viewBox="0 0 780 386"></svg>
  <div class="grid2 pr-caps">
    <div class="card pr-cap-metal"></div>
    <div class="card pr-cap-ionic"></div>
  </div>
</div>

<div data-pane="cond">
  <p class="mut">切换样品放入 d.c. 电路，观察灯泡亮灭与微观带电粒子的运动（左电极接正极为 <b>anode (+)</b>，右电极接负极为 <b>cathode (−)</b>）。</p>
  <div class="row pr-picks"></div>
  <svg class="pr-svg pr-svg2" viewBox="0 0 780 354"></svg>
  <div class="card pr-cap-cond"></div>
</div>

<style>
.k .pr-fctl{gap:10px}
.k .pr-sl{display:inline-flex;align-items:center;gap:8px;flex:1;min-width:230px}
.k .pr-sl input[type=range]{flex:1;min-width:110px}
.k .pr-dval{min-width:3.2em;text-align:center}
.k .pr-al{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card)}

.k .pr-picks button{font-size:14px;padding:4px 10px}
.k .pr-svg{
  --ion-ink:#ffffff;
  margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:8px;user-select:none
}

  .k .pr-svg{--ion-ink:#0d1220}
}
.k .pr-svg text{font-size:16px}
.k .pr-svg text.hd{font-weight:700}
.k .pr-svg text.sub{fill:var(--mut)}
.k .pr-svg text.ok{fill:var(--ok);font-weight:700}
.k .pr-svg text.bad{fill:var(--bad);font-weight:700}
.k .pr-svg text.warn{fill:var(--s4);font-weight:700}
.k .pr-svg text.pos{fill:var(--pos);font-weight:700}
.k .pr-svg text.neg{fill:var(--neg);font-weight:700}
.k .pr-svg text.sgn{fill:var(--ion-ink);font-weight:700;pointer-events:none}
.k .pr-svg text.sgn-lg{fill:var(--ion-ink);font-size:19px;font-weight:700;pointer-events:none}

.k .pr-svg .m-zn{fill:var(--s4);stroke:var(--card);stroke-width:1.8}
.k .pr-svg .i-pos{fill:var(--pos);stroke:var(--card);stroke-width:1.4}
.k .pr-svg .i-neg{fill:var(--neg);stroke:var(--card);stroke-width:1.4}
.k .pr-svg .el-dot{fill:var(--neg);stroke:var(--card);stroke-width:1}

.k .pr-svg .cham-molten{fill:color-mix(in srgb,var(--s4) 13%,var(--card));stroke:var(--s4);stroke-width:1.6}
.k .pr-svg .cham-aq{fill:color-mix(in srgb,var(--acc) 12%,var(--card));stroke:var(--acc);stroke-width:1.6}
.k .pr-svg .elec-pos{fill:color-mix(in srgb,var(--pos) 18%,var(--card));stroke:var(--pos);stroke-width:2.4}
.k .pr-svg .elec-neg{fill:color-mix(in srgb,var(--neg) 18%,var(--card));stroke:var(--neg);stroke-width:2.4}
.k .pr-svg .cov{stroke:var(--fg);stroke-width:2.6;stroke-linecap:round}
.k .pr-svg .imf{stroke:var(--faint);stroke-width:1.3;stroke-dasharray:4 4}
.k .pr-svg .c-atom{fill:var(--neu);stroke:var(--card);stroke-width:1.4}
.k .pr-svg .i2-atom{fill:var(--s5);stroke:var(--card);stroke-width:1.3}
.k .pr-svg .bulb-glow1{fill:var(--s4);opacity:.18}
.k .pr-svg .bulb-glow2{fill:var(--hl);opacity:.65}
.k .pr-svg .bulb-on{fill:color-mix(in srgb,var(--hl) 78%,var(--s4));stroke:var(--s4);stroke-width:2.5}
.k .pr-svg .bulb-off{fill:var(--bg);stroke:var(--faint);stroke-width:2}
.k .pr-svg .bulb-x-on{fill:none;stroke:var(--s4);stroke-width:2.2;stroke-linejoin:round}
.k .pr-svg .bulb-x-off{fill:none;stroke:var(--faint);stroke-width:2.1;stroke-linejoin:round}
.k .pr-caps{margin-top:8px}
.k .pr-cap-metal,.k .pr-cap-ionic,.k .pr-cap-cond{font-size:14.5px;line-height:1.55}
.k .pr-ms{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--ok-soft);color:var(--ok);font-weight:650}
.k .pr-ms-off{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--acc-soft);color:var(--acc);font-weight:650}
.k .pr-pit{margin-top:5px;padding:5px 9px;border-left:3px solid var(--bad);background:var(--bad-soft);border-radius:0 5px 5px 0;font-size:13.8px}
</style>

<script>
K.init($root);

/* deterministic seeded PRNG (mulberry32) */
function mulberry(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var curTab = 'force';
var svg1 = $root.querySelector('.pr-svg1');
var svg2 = $root.querySelector('.pr-svg2');
var dispRange = $root.querySelector('.pr-disp');
var dispVal = $root.querySelector('.pr-dval');
var alloyChk = $root.querySelector('.pr-alloy');
var capMetal = $root.querySelector('.pr-cap-metal');
var capIonic = $root.querySelector('.pr-cap-ionic');
var capCond = $root.querySelector('.pr-cap-cond');
var pauseBtn = $root.querySelector('.pr-pause');

/* Helper: place label on <svg> via K.label and add card backing rect behind it */
function placeLab(svg, gBack, gText, x, y, txt, cls, cands, avoid, placed) {
  var e = K.label(svg, x, y, txt, { cls: cls || '', cands: cands, avoid: avoid, placed: placed, pad: 2 });
  gText.appendChild(e);
  if (gBack) {
    var b = e.getBBox();
    gBack.appendChild(K.svg('rect', { x: b.x - 3, y: b.y - 1, width: b.width + 6, height: b.height + 2, 'class': 'bk' }));
  }
  return e;
}

/* Helper: draw an explicit arrow (single or double headed) with visible shaft */
function arrowPath(x1, y1, x2, y2, headLen, headHalf, dbl) {
  var dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
  var ux = dx / L, uy = dy / L, px = -uy, py = ux;
  var hl = Math.min(headLen || 8, L * (dbl ? 0.36 : 0.48)), hw = headHalf || 4.8;
  var sx1 = dbl ? x1 + ux * (hl * 0.7) : x1, sy1 = dbl ? y1 + uy * (hl * 0.7) : y1;
  var sx2 = x2 - ux * (hl * 0.7), sy2 = y2 - uy * (hl * 0.7);
  var d = 'M' + sx1.toFixed(1) + ',' + sy1.toFixed(1) + 'L' + sx2.toFixed(1) + ',' + sy2.toFixed(1);
  var bx2 = x2 - ux * hl, by2 = y2 - uy * hl;
  d += ' M' + x2.toFixed(1) + ',' + y2.toFixed(1) +
       'L' + (bx2 + px * hw).toFixed(1) + ',' + (by2 + py * hw).toFixed(1) +
       'L' + (bx2 - px * hw).toFixed(1) + ',' + (by2 - py * hw).toFixed(1) + 'Z';
  if (dbl) {
    var bx1 = x1 + ux * hl, by1 = y1 + uy * hl;
    d += ' M' + x1.toFixed(1) + ',' + y1.toFixed(1) +
         'L' + (bx1 + px * hw).toFixed(1) + ',' + (by1 + py * hw).toFixed(1) +
         'L' + (bx1 - px * hw).toFixed(1) + ',' + (by1 - py * hw).toFixed(1) + 'Z';
  }
  return d;
}

/* ==========================================================================
   TAB 1: 受力 — malleable vs brittle (+ alloy)
   ========================================================================== */
var DM = 54, DI = 50;
var metalElectrons = (function () {
  var rng = mulberry(9701041);
  /* 16 interstitial electron anchors placed at triangle centroids / sea margins well clear of all 16 metal ions */
  var raw = [
    /* Upper block: 4 along top sea margin + 4 in triangular voids between row 0 (y=126) and row 1 (y=174) */
    { bx: 105, by: 106, upper: true },
    { bx: 159, by: 106, upper: true },
    { bx: 213, by: 106, upper: true },
    { bx: 267, by: 106, upper: true },
    { bx: 64,  by: 152, upper: true },
    { bx: 105, by: 142, upper: true },
    { bx: 213, by: 142, upper: true },
    { bx: 278, by: 146, upper: true },
    /* Lower block: 4 in triangular voids between row 2 (y=222) and row 3 (y=270) + 4 along bottom sea margin */
    { bx: 64,  by: 248, upper: false },
    { bx: 105, by: 238, upper: false },
    { bx: 132, by: 254, upper: false },
    { bx: 240, by: 254, upper: false },
    { bx: 78,  by: 290, upper: false },
    { bx: 132, by: 290, upper: false },
    { bx: 186, by: 290, upper: false },
    { bx: 240, by: 290, upper: false }
  ];
  return raw.map(function (p) {
    return {
      bx: p.bx,
      by: p.by,
      upper: p.upper,
      ax: 2.4 + rng() * 1.2,
      ay: 2.0 + rng() * 1.1,
      wx: 2.3 + rng() * 1.9,
      wy: 2.1 + rng() * 2.0,
      px: rng() * Math.PI * 2,
      py: rng() * Math.PI * 2
    };
  });
})();

var tab1Dom = { eCircles: [], eLines: [] };
var lastMetalShiftPx = 0, lastRepulsionShown = false, lastIonicState = 'intact';

function drawForce() {
  if (curTab !== 'force') return;
  var s = +dispRange.value;
  var isAlloy = alloyChk.checked;
  dispVal.textContent = s.toFixed(2);

  /* Metal displacement: pure copper slides full DM (54 px); alloy jams at ~0.20 * DM (10.8 px) where larger Zn atoms collide */
  var mFrac = isAlloy ? Math.min(s, 0.20) : s;
  var mShift = mFrac * DM;
  lastMetalShiftPx = mShift;

  /* Ionic displacement & cleavage geometry */
  var iDx, iLift, iDrop;
  if (s <= 0.5) {
    iDx = (s / 0.5) * DI;
    var sep = s < 0.22 ? 0 : ((s - 0.22) / 0.28);
    iLift = sep * 18;
    iDrop = sep * 18;
  } else {
    var u = (s - 0.5) / 0.5;
    /* stays aligned like-over-like: repulsion forces the two halves apart across the cleavage plane */
    iDx = DI;
    iLift = 18 + u * 10;
    iDrop = 18 + u * 10;
  }
  var showRepel = s >= 0.4 - 1e-9;
  var shattered = s >= 0.85 - 1e-9;
  lastRepulsionShown = showRepel;
  lastIonicState = shattered ? 'shattered' : (showRepel ? 'repel' : 'intact');

  svg1.innerHTML = '';
  tab1Dom.eCircles = [];
  tab1Dom.eLines = [];

  var gSea = K.svg('g'), gStruct = K.svg('g'), gIons = K.svg('g'), gElec = K.svg('g'), gFx = K.svg('g'), gBack = K.svg('g'), gLab = K.svg('g');
  [gSea, gStruct, gIons, gElec, gFx, gBack, gLab].forEach(function (g) { svg1.appendChild(g); });

  var avoid = [[390, 14, 390, 372]], placed = [];
  gStruct.appendChild(K.svg('line', { x1: 390, y1: 14, x2: 390, y2: 372, 'class': 'div' }));

  /* ---- Left Panel: Metal / Alloy ---- */
  var mCols = [78, 132, 186, 240];
  var mRows = [126, 174, 222, 270];
  /* Sea of delocalised electrons: two identical-width rounded envelopes meeting cleanly at slip plane y=198 */
  gSea.appendChild(K.svg('rect', { x: 52 + mShift, y: 97, width: 242, height: 100, rx: 16, 'class': 'sea' }));
  gSea.appendChild(K.svg('rect', { x: 52, y: 199, width: 242, height: 100, rx: 16, 'class': 'sea' }));
  gStruct.appendChild(K.svg('line', { x1: 38, y1: 198, x2: 362, y2: 198, 'class': 'slip' }));

  /* Applied shear force arrow on upper metal block (moves with the upper block) */
  var mArrowX1 = 16 + mShift, mArrowX2 = 46 + mShift;
  gFx.appendChild(K.svg('path', {
    d: arrowPath(mArrowX1, 148, mArrowX2, 148, 8, 4.8, false),
    style: 'fill:var(--acc);stroke:var(--acc);stroke-width:2.4'
  }));
  avoid.push([mArrowX1, 148, mArrowX2, 148]);

  for (var mr = 0; mr < 4; mr++) {
    var stag = (mr % 2) * 27;
    var rowShift = mr < 2 ? mShift : 0;
    for (var mc = 0; mc < 4; mc++) {
      var isZn = isAlloy && ((mr === 1 && mc === 1) || (mr === 2 && mc === 2));
      /* Neighbour distortion in alloy: larger Zn atoms visibly disrupt the regular rows */
      var distX = 0, distY = 0;
      if (isAlloy) {
        if (mr === 1 && mc === 1) distY = 4;
        if (mr === 2 && mc === 2) distY = -4;
        if (mr === 1 && mc === 0) { distX = -4; distY = -2; }
        if (mr === 1 && mc === 2) { distX = 5; distY = -2; }
        if (mr === 0 && mc === 1) { distY = -3; }
        if (mr === 0 && mc === 2) { distY = -3; }
        if (mr === 2 && mc === 1) { distX = -5; distY = 2; }
        if (mr === 2 && mc === 3) { distX = 4; distY = 2; }
        if (mr === 3 && mc === 1) { distY = 3; }
        if (mr === 3 && mc === 2) { distY = 3; }
      }
      var cx = mCols[mc] + stag + rowShift + distX;
      var cy = mRows[mr] + distY;
      var rad = isZn ? 22.5 : 16.5;
      gIons.appendChild(K.svg('circle', {
        cx: cx.toFixed(1), cy: cy.toFixed(1), r: rad,
        'class': isZn ? 'm-zn' : 'm-cu',
        'data-role': 'metal-ion',
        'data-layer': mr < 2 ? 'upper' : 'lower',
        'data-kind': isZn ? 'zn' : 'cu'
      }));
      var st = K.svg('text', { x: cx.toFixed(1), y: (cy + 5.5).toFixed(1), 'text-anchor': 'middle', 'class': 'sgn' });
      st.textContent = isZn ? 'Zn' : '+';
      gIons.appendChild(st);
      placed.push({ x: cx - rad - 2, y: cy - rad - 2, w: rad * 2 + 4, h: rad * 2 + 4 });
    }
  }

  /* Jammed contact highlight when alloy blocks layer slip */
  if (isAlloy && s >= 0.15) {
    var jx1 = mCols[1] + 27 + mShift, jy1 = mRows[1] + 4;
    var jx2 = mCols[2], jy2 = mRows[2] - 4;
    var mx = (jx1 + jx2) / 2, my = (jy1 + jy2) / 2;
    var jamG = K.svg('g', { 'data-role': 'alloy-jam' });
    jamG.appendChild(K.svg('line', {
      x1: (mx - 12).toFixed(1), y1: (my + 9).toFixed(1), x2: (mx + 12).toFixed(1), y2: (my - 9).toFixed(1),
      style: 'stroke:var(--card);stroke-width:5.2;stroke-linecap:round'
    }));
    jamG.appendChild(K.svg('line', {
      x1: (mx - 12).toFixed(1), y1: (my + 9).toFixed(1), x2: (mx + 12).toFixed(1), y2: (my - 9).toFixed(1),
      style: 'stroke:var(--bad);stroke-width:3;stroke-linecap:round'
    }));
    gFx.appendChild(jamG);
  }

  /* Delocalised electrons in metal */
  metalElectrons.forEach(function (me, idx) {
    var c = K.svg('circle', { r: 5.2, 'class': 'el-dot', 'data-role': 'metal-e', 'data-idx': idx });
    var ln = K.svg('line', { 'class': 'el-minus' });
    gElec.appendChild(c);
    gElec.appendChild(ln);
    tab1Dom.eCircles.push({ el: c, ln: ln, cfg: me, shift: me.upper ? mShift : 0 });
  });

  /* ---- Right Panel: Giant Ionic (NaCl) ---- */
  var iCols = [462, 512, 562, 612];
  var iRows = [132, 174, 218, 260];
  if (!shattered) {
    var slipY = (174 - iLift + 218 + iDrop) / 2;
    gStruct.appendChild(K.svg('line', { x1: 424, y1: slipY.toFixed(1), x2: 744, y2: slipY.toFixed(1), 'class': 'slip' }));
  }

  /* Applied shear force arrow on upper ionic block */
  var iArrowX1 = 412 + Math.min(iDx, 50) * 0.6, iArrowX2 = 442 + Math.min(iDx, 50) * 0.6;
  var iArrowY = 153 - iLift;
  gFx.appendChild(K.svg('path', {
    d: arrowPath(iArrowX1, iArrowY, iArrowX2, iArrowY, 8, 4.8, false),
    style: 'fill:var(--acc);stroke:var(--acc);stroke-width:2.4'
  }));
  avoid.push([iArrowX1, iArrowY, iArrowX2, iArrowY]);

  for (var ir = 0; ir < 4; ir++) {
    var iShiftX = ir < 2 ? iDx : 0;
    var iShiftY = ir < 2 ? -iLift : iDrop;
    for (var ic = 0; ic < 4; ic++) {
      /* At s=0: row 1 is (+, −, +, −), row 2 is (−, +, −, +); at s=0.5 (iDx=50), row 1 (+,−,+) aligns over row 2 (+,−,+) at cols 1,2,3! */
      var isPos = ((ir + ic) % 2 === 1);
      var icx = iCols[ic] + iShiftX;
      var icy = iRows[ir] + iShiftY;
      var irad = isPos ? 12.5 : 18.5;
      gIons.appendChild(K.svg('circle', {
        cx: icx.toFixed(1), cy: icy.toFixed(1), r: irad,
        'class': isPos ? 'i-pos' : 'i-neg',
        'data-role': 'ionic-ion',
        'data-charge': isPos ? 'pos' : 'neg',
        'data-layer': ir < 2 ? 'upper' : 'lower'
      }));
      var ist = K.svg('text', {
        x: icx.toFixed(1), y: (icy + (isPos ? 5.5 : 6.2)).toFixed(1),
        'text-anchor': 'middle', 'class': isPos ? 'sgn' : 'sgn-lg'
      });
      ist.textContent = isPos ? '+' : '−';
      gIons.appendChild(ist);
      placed.push({ x: icx - irad - 2, y: icy - irad - 2, w: irad * 2 + 4, h: irad * 2 + 4 });
    }
  }

  /* Jagged fracture / cleavage crack line when shattered (s >= 0.85) */
  if (shattered) {
    var cyMid = (iRows[1] - iLift + iRows[2] + iDrop) / 2;
    var pts = [[432, cyMid + 4], [472, cyMid - 6], [512, cyMid + 5], [556, cyMid - 6], [600, cyMid + 6], [646, cyMid - 5], [692, cyMid + 5], [736, cyMid - 4]];
    var cd = 'M' + pts.map(function (p) { return p[0] + ',' + p[1].toFixed(1); }).join('L');
    gFx.appendChild(K.svg('path', {
      d: cd,
      style: 'fill:none;stroke:var(--bad);stroke-width:2.2;stroke-dasharray:6 4;opacity:0.75',
      'data-role': 'cleavage-crack'
    }));
    avoid = avoid.concat(K.segs(pts));
  }

  /* Red double-headed repulsion arrows when s >= 0.4 */
  if (showRepel) {
    /* Aligned pairs: upper row 1 (ic = 0, 1, 2) faces lower row 2 (ic = 1, 2, 3) */
    for (var k = 0; k < 3; k++) {
      var isPosPair = ((1 + k) % 2 === 1);
      var pr = isPosPair ? 12.5 : 18.5;
      var pad = isPosPair ? 6.5 : 4.2;
      var ux = iCols[k] + iDx, uy = iRows[1] - iLift + pr + pad;
      var lx = iCols[k + 1], ly = iRows[2] + iDrop - pr - pad;
      var rg = K.svg('g', { 'data-role': 'repulsion-arrow' });
      var ap = arrowPath(ux, uy, lx, ly, 7.2, 4.4, true);
      /* Card-coloured halo behind arrow so cleavage crack never muddies the arrow shaft */
      rg.appendChild(K.svg('path', {
        d: ap,
        style: 'fill:var(--card);stroke:var(--card);stroke-width:6.5;stroke-linejoin:round'
      }));
      rg.appendChild(K.svg('path', {
        d: ap,
        style: 'fill:var(--bad);stroke:var(--bad);stroke-width:2.4'
      }));
      gFx.appendChild(rg);
      avoid.push([ux, uy, lx, ly]);
    }
  }

  /* ---- All SVG text annotations via K.label ---- */
  placeLab(svg1, gBack, gLab, 196, 24,
    isAlloy ? 'alloy: brass (Cu + larger Zn)' : 'giant metallic: copper',
    'hd', [[0, 0, 'middle']], avoid, placed);
  placeLab(svg1, gBack, gLab, 584, 24,
    'giant ionic: sodium chloride',
    'hd', [[0, 0, 'middle']], avoid, placed);

  placeLab(svg1, gBack, gLab, 196, 51,

    lys.forEach(function (ly) {
      g.appendChild(K.svg('line', { x1: cxs[0], y1: ly - 3, x2: cxs[cxs.length - 1], y2: ly - 3, 'class': 'cov' }));
      g.appendChild(K.svg('line', { x1: cxs[0], y1: ly + 3, x2: cxs[cxs.length - 1], y2: ly + 3, 'class': 'cov' }));
      cxs.forEach(function (cx) {
        g.appendChild(K.svg('circle', { cx: cx, cy: ly, r: 8.5, 'class': 'c-atom', 'data-role': 'c-atom' }));
      });
    });
    [181.5, 240.5].forEach(function (ey, li) {
      for (var k = 0; k < 4; k++) {
        var c = K.svg('circle', { r: 5.5, 'class': 'el-dot', 'data-carrier': 'e' });
        var ln = K.svg('line', { 'class': 'el-minus' });
        var ar = K.svg('path', { style: 'fill:var(--neg);stroke:var(--neg);stroke-width:1.6' });
        g.appendChild(ar); g.appendChild(c); g.appendChild(ln);
        tab2Dom.movers.push({
          kind: 'drift-e', c: c, ln: ln, ar: ar, y: ey,
          u0: (0.14 + k / 4 + li * 0.08) % 1, speed: 0.16, ampY: 1.4, ph: rng() * 6.28
        });
      }
    });
  } else if (curSample === 'diamond') {
    /* 3D tetrahedral covalent network projection: every interior C bonded to 4 neighbours, 0 free electrons */
    var nodes = [
      [255, 152], [325, 152], [395, 152], [465, 152], [525, 152],
      [290, 188], [360, 188], [430, 188], [500, 188],
      [255, 228], [325, 228], [395, 228], [465, 228], [525, 228],
      [290, 266], [360, 266], [430, 266], [500, 266]
    ];
    var bonds = [
      [0,5],[1,5],[1,6],[2,6],[2,7],[3,7],[3,8],[4,8],
      [5,9],[5,10],[6,10],[6,11],[7,11],[7,12],[8,12],[8,13],
      [9,14],[10,14],[10,15],[11,15],[11,16],[12,16],[12,17],[13,17]
    ];
    bonds.forEach(function (b) {
      g.appendChild(K.svg('line', {
        x1: nodes[b[0]][0], y1: nodes[b[0]][1], x2: nodes[b[1]][0], y2: nodes[b[1]][1], 'class': 'cov'
      }));
    });
    nodes.forEach(function (nd) {
      g.appendChild(K.svg('circle', { cx: nd[0], cy: nd[1], r: 9.5, 'class': 'c-atom', 'data-role': 'c-atom' }));
    });
  } else if (curSample === 'iodine') {
    /* Discrete neutral I2 diatomic molecules with strong covalent bond inside & weak id-id dashed lines between */
    var mxs = [268, 350, 432, 514], mys = [174, 248];
    /* Weak intermolecular id-id dashed lines between adjacent I2 molecules */
    for (var mi = 0; mi < 3; mi++) {
      g.appendChild(K.svg('line', { x1: mxs[mi] + 22, y1: 174, x2: mxs[mi + 1] - 22, y2: 174, 'class': 'imf' }));
      g.appendChild(K.svg('line', { x1: mxs[mi] + 22, y1: 248, x2: mxs[mi + 1] - 22, y2: 248, 'class': 'imf' }));
    }
    mxs.forEach(function (mx) {
      g.appendChild(K.svg('line', { x1: mx, y1: 192, x2: mx, y2: 230, 'class': 'imf' }));
    });
    mys.forEach(function (my, ri) {
      mxs.forEach(function (mx, ci) {
        var ang = ((ri + ci) % 2 === 0 ? 26 : -26) * Math.PI / 180;
        var dx = Math.cos(ang) * 10.5, dy = Math.sin(ang) * 10.5;
        var bl = K.svg('line', { 'class': 'cov' });
        var a1 = K.svg('circle', { r: 10.5, 'class': 'i2-atom', 'data-role': 'i2-atom' });
        var a2 = K.svg('circle', { r: 10.5, 'class': 'i2-atom', 'data-role': 'i2-atom' });
        g.appendChild(bl); g.appendChild(a1); g.appendChild(a2);
        tab2Dom.movers.push({
          kind: 'vib-i2', bl: bl, a1: a1, a2: a2, bx: mx, by: my, dx: dx, dy: dy,
          ax: 1.7, ay: 1.5, wx: 10 + rng() * 3, wy: 9 + rng() * 3, px: rng() * 6.28, py: rng() * 6.28
        });
      });
    });
  }
}

function pointOnPoly(pts, u) {
  var segs = [], tot = 0;
  for (var i = 1; i < pts.length; i++) {
    var L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    segs.push({ a: pts[i - 1], b: pts[i], L: L }); tot += L;
  }
  var target = ((u % 1) + 1) % 1 * tot, acc = 0;
  for (i = 0; i < segs.length; i++) {
    if (acc + segs[i].L >= target || i === segs.length - 1) {
      var f = (target - acc) / (segs[i].L || 1);
      return [segs[i].a[0] + (segs[i].b[0] - segs[i].a[0]) * f, segs[i].a[1] + (segs[i].b[1] - segs[i].a[1]) * f];
    }
    acc += segs[i].L;
  }
  return pts[0];
}

function edgeAlpha(u) {
  return u < 0.05 ? u / 0.05 : (u > 0.95 ? (1 - u) / 0.05 : 1);
}

function updateCondAnim() {
  if (curTab !== 'cond') return;
  tab2Dom.wireDots.forEach(function (wd) {
    var pt = pointOnPoly(wd.trk, wd.phase + simTime * 0.28);
    wd.el.setAttribute('cx', pt[0].toFixed(1));
    wd.el.setAttribute('cy', pt[1].toFixed(1));
  });
  tab2Dom.movers.forEach(function (m) {
    if (m.kind === 'drift-e') {
      /* Electrons drift right -> left towards anode (+) */
      var u = ((m.u0 - simTime * m.speed) % 1 + 1) % 1;
      var ex = XL + u * XSPAN;
      var ey = m.y + m.ampY * Math.sin(simTime * 5.2 + m.ph);
      var op = edgeAlpha(u).toFixed(2);
      m.c.setAttribute('cx', ex.toFixed(2)); m.c.setAttribute('cy', ey.toFixed(2));
      m.ln.setAttribute('x1', (ex - 2.8).toFixed(2)); m.ln.setAttribute('y1', ey.toFixed(2));
      m.ln.setAttribute('x2', (ex + 2.8).toFixed(2)); m.ln.setAttribute('y2', ey.toFixed(2));
      m.ar.setAttribute('d', arrowPath(ex - 6, ey, ex - 16, ey, 5, 3.0, false));
      m.c.style.opacity = op; m.ln.style.opacity = op; m.ar.style.opacity = op;
    } else if (m.kind === 'drift-pos') {
      /* Na+ cation drifts left -> right towards cathode (−) */
      var up = (m.u0 + simTime * m.speed) % 1;
      var px = XL + up * XSPAN, py = m.y + 1.6 * Math.sin(simTime * 3.8 + m.ph);
      var opp = edgeAlpha(up).toFixed(2);
      m.c.setAttribute('cx', px.toFixed(2)); m.c.setAttribute('cy', py.toFixed(2));
      m.t.setAttribute('x', px.toFixed(2)); m.t.setAttribute('y', (py + m.dyTxt).toFixed(2));
      m.ar.setAttribute('d', arrowPath(px + m.rad + 2, py, px + m.rad + 16, py, 6, 3.6, false));
      m.c.style.opacity = opp; m.t.style.opacity = opp; m.ar.style.opacity = opp;
    } else if (m.kind === 'drift-neg') {
      /* Cl- anion drifts right -> left towards anode (+) */
      var un = ((m.u0 - simTime * m.speed) % 1 + 1) % 1;
      var nx = XL + un * XSPAN, ny = m.y + 1.6 * Math.cos(simTime * 3.6 + m.ph);
      var opn = edgeAlpha(un).toFixed(2);
      m.c.setAttribute('cx', nx.toFixed(2)); m.c.setAttribute('cy', ny.toFixed(2));
      m.t.setAttribute('x', nx.toFixed(2)); m.t.setAttribute('y', (ny + m.dyTxt).toFixed(2));
      m.ar.setAttribute('d', arrowPath(nx - m.rad - 2, ny, nx - m.rad - 16, ny, 6, 3.6, false));
      m.c.style.opacity = opn; m.t.style.opacity = opn; m.ar.style.opacity = opn;
    } else if (m.kind === 'vib-ion') {
      var vx = m.bx + m.ax * Math.sin(m.wx * simTime + m.px);
      var vy = m.by + m.ay * Math.cos(m.wy * simTime + m.py);
      m.c.setAttribute('cx', vx.toFixed(2)); m.c.setAttribute('cy', vy.toFixed(2));
      m.t.setAttribute('x', vx.toFixed(2)); m.t.setAttribute('y', (vy + m.dyTxt).toFixed(2));
    } else if (m.kind === 'vib-i2') {
      var ix = m.bx + m.ax * Math.sin(m.wx * simTime + m.px);
      var iy = m.by + m.ay * Math.cos(m.wy * simTime + m.py);
      m.a1.setAttribute('cx', (ix - m.dx).toFixed(2)); m.a1.setAttribute('cy', (iy - m.dy).toFixed(2));
      m.a2.setAttribute('cx', (ix + m.dx).toFixed(2)); m.a2.setAttribute('cy', (iy + m.dy).toFixed(2));
      m.bl.setAttribute('x1', (ix - m.dx).toFixed(2)); m.bl.setAttribute('y1', (iy - m.dy).toFixed(2));
      m.bl.setAttribute('x2', (ix + m.dx).toFixed(2)); m.bl.setAttribute('y2', (iy + m.dy).toFixed(2));
    }
  });
}

/* ==========================================================================
   Animation Loop: rAF + IntersectionObserver + Pause + Deterministic __sim
   ========================================================================== */
var simTime = 0;
var userPaused = false;
var ioVisible = true;
var rafId = 0, lastTs = 0;

function renderFrame() {
  if (curTab === 'force') updateForceAnim();
  else updateCondAnim();
}

function shouldRun() {
  return !userPaused && ioVisible && document.visibilityState !== 'hidden';
}

function tick(ts) {
  rafId = 0;
  if (!shouldRun()) { lastTs = 0; return; }
  if (lastTs) {
    var dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
    simTime += dt;
    renderFrame();
  }
  lastTs = ts;
  rafId = requestAnimationFrame(tick);
}

function syncLoop() {
  if (shouldRun()) {
    if (!rafId) { lastTs = 0; rafId = requestAnimationFrame(tick); }
  } else if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = 0;
    lastTs = 0;
  }
}

pauseBtn.addEventListener('click', function () {
  userPaused = !userPaused;
  pauseBtn.classList.toggle('on', userPaused);
  pauseBtn.textContent = userPaused ? '▶ 继续' : '⏸ 暂停';
  syncLoop();
});

if (window.IntersectionObserver) {
  new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.target === $root) {
        ioVisible = en.isIntersecting;
        syncLoop();
      }
    });
  }, { threshold: 0.01 }).observe($root);
}
document.addEventListener('visibilitychange', syncLoop);

/* ---- Event bindings ---- */
function onDisp() { drawForce(); K.fit(); }
dispRange.addEventListener('input', onDisp);
alloyChk.addEventListener('change', onDisp);
K.$$($root, '.pr-pre').forEach(function (b) {
  b.addEventListener('click', function () {
    dispRange.value = b.getAttribute('data-d');
    onDisp();
  });
});

$root.addEventListener('tab', function (ev) {
  curTab = ev.detail;
  if (curTab === 'force') drawForce();
  else drawCond();
  renderFrame();
});

/* Initial render of Tab 1 */
drawForce();
syncLoop();

/* Testing & synchronous fast-forward hook */
$root.__sim = {
  step: function (dtSec) { simTime += dtSec; renderFrame(); return simTime; },
  resetTime: function (t) { simTime = t || 0; renderFrame(); return simTime; },
  time: function () { return simTime; },
  isRunning: shouldRun,
  isVisible: function () { return ioVisible; },
  isPaused: function () { return userPaused; },
  setPaused: function (p) { if (!!p !== userPaused) pauseBtn.click(); },
  setDisp: function (v) { dispRange.value = v; onDisp(); },
  setAlloy: function (on) { alloyChk.checked = !!on; onDisp(); },
  setSample: function (id) { selectSample(id); },
  state: function () {
    return {
      tab: curTab,
      disp: +dispRange.value,
      alloy: alloyChk.checked,
      metalShiftPx: lastMetalShiftPx,
      repulsionShown: lastRepulsionShown,
      ionicState: lastIonicState,
      sample: curSample,
      lampOn: SAMPLES[curSample].conducts
    };
  }
};
</script>
